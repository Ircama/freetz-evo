name: github_zensical

on:
  workflow_run:
    workflows: [ postcommit_docs,postcommit_stats,avm_ftp,avm_osp,avm_juis,avm_juis-recache ]
    types:
      - completed
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/github_zensical.yml'
      - '.github/zensical/**'
      - 'docs/extra.css'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    env:
      ZENSICAL_REQUIREMENTS_FILE: .github/zensical/requirements.txt
      ZENSICAL_CONFIG_FILE: .github/zensical/zensical.toml
      ZENSICAL_INPUT_PATH: .github/zensical/site
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'freetz-ng/freetz-ng' || github.repository == 'ircama/freetz-evo' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: python3 -m pip install --upgrade -r "${{ env.ZENSICAL_REQUIREMENTS_FILE }}"
      - name: Show renderer versions
        run: python3 -m pip show Markdown zensical pymdown-extensions Pygments
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Zensical
        run: zensical build --config-file "${{ env.ZENSICAL_CONFIG_FILE }}"
      - name: Verify syntax highlighting markup
        run: |
          TARGET_HTML="${{ env.ZENSICAL_INPUT_PATH }}/REPO_README/index.html"
          test -f "$TARGET_HTML"
          grep -q '<div class="language-bash highlight">' "$TARGET_HTML"
          if grep -q '<pre><code class="language-bash">' "$TARGET_HTML"; then
            echo "Detected non-tokenized bash fences in $TARGET_HTML"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "${{ env.ZENSICAL_INPUT_PATH }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


