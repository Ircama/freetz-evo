# .github/workflows/sync-upstream.yml
#
# Sync freetz-evo with upstream Freetz-NG/freetz-ng
#
# Strategy: merge-based (not rebase) to preserve history, avoid force-push,
# and keep master always clean.
#
# Flow:
#   1. Update 'upstream-mirror' branch (exact copy of upstream/master)
#   2. Try merge into a staging branch 'sync/upstream-YYYYMMDD'
#   3. If clean -> fast-forward master
#   4. If conflict -> auto-resolve with DeepSeek LLM
#   5. If LLM resolution succeeds -> fast-forward master
#   6. If LLM cannot resolve all -> open GitHub Issue, master untouched
#
# The 'upstream-mirror' branch is useful for:
#   - Quick diffs:  git diff master..upstream-mirror
#   - Seeing what upstream changed since last sync
#   - Manual conflict resolution base
#
# Secrets required:
#   DEEPSEEK_API_KEY : API key for DeepSeek chat API
#   DEEPSEEK_PROMPT  : System prompt for merge conflict resolution
#
# Recommended content for DEEPSEEK_PROMPT secret:
#
# You are a Senior Software Engineer and Version Control (Git) Expert
# specializing in embedded firmware development, with complete knowledge of
# the Freetz-EVO project and its upstream.
#
# Your task is to merge incoming upstream changes into the local Freetz-EVO
# codebase by analyzing each conflicted file, understanding both sides, and
# producing a correct, idiomatic merge.
#
# === General Rules ===
# 1. NO BLIND MERGE: Never apply blanket strategies. Analyze every block.
# 2. PRESERVE VALUE: Integrate both local and upstream improvements.
# 3. PRUDENCE: If ambiguous, leave conflict markers and report it.
#
# === Package Migration Rules ===
# - Packages moved to 'Disk Tools' MUST stay there.
#
# === Documentation Language Rules ===
# - Target language is ENGLISH. Translate German additions accurately.
# - Wiki docs merge into improved English-only standard.
#
# === Core/Modified Package Rules ===
# - PROTECT local Freetz-EVO modifications critical for other packages.
# - Integrate upstream novelties only if they don't conflict with local logic.
#
# === freetz-ng Framework Rules ===
# - Variables in modconf MUST be exported in default cfg.
# - pkg_pre_save() = validation only; pkg_apply_save() = runtime updates.
# - Do NOT read POST data in save hooks (framework consumed it).
# - Do NOT add implicit service restarts on save.
# - CGI: return HTML-wrapped JSON for AJAX, not plain JSON.
# - Init: avoid 'local' in case; use async boot for USB/network waits.
# - Always timestamp-backup user configs before overwrite.
# - Security whitelists for CGI file operations; prevent directory traversal.
#
# === Response Format ===
# Output ONLY the final merged file content. No markdown code fences,
# no explanations, no surrounding text. The result must be a valid file
# ready to write to disk.

name: Sync Upstream freetz-ng

on:
  schedule:
    - cron: '0 6 */10 * *'        # every 10 days at 06:00 UTC
  workflow_dispatch:               # manual trigger from Actions tab
    inputs:
      dry_run:
        description: 'Dry run (do not push to master)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/Freetz-NG/freetz-ng.git
      UPSTREAM_BRANCH: master
      LOCAL_BRANCH: master
      MIRROR_BRANCH: upstream-mirror

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LOCAL_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "freetz-evo-bot"
          git config user.email "freetz-evo-bot@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || true
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags
          echo "UPSTREAM_SHA=$(git rev-parse upstream/$UPSTREAM_BRANCH)" >> "$GITHUB_ENV"
          echo "Upstream HEAD: $(git rev-parse --short upstream/$UPSTREAM_BRANCH)"

      # -- 1. Update upstream-mirror branch --
      - name: Update upstream-mirror branch
        run: |
          if git show-ref --verify --quiet "refs/heads/$MIRROR_BRANCH"; then
            git branch -f "$MIRROR_BRANCH" "upstream/$UPSTREAM_BRANCH"
          else
            git branch "$MIRROR_BRANCH" "upstream/$UPSTREAM_BRANCH"
          fi
          git push origin "$MIRROR_BRANCH" --force-with-lease

      # -- 2. Check if sync is needed --
      - name: Check if already up-to-date
        id: check
        run: |
          MERGE_BASE=$(git merge-base "$LOCAL_BRANCH" "upstream/$UPSTREAM_BRANCH")
          UPSTREAM_HEAD=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          if [ "$MERGE_BASE" = "$UPSTREAM_HEAD" ]; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date with upstream."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            NEW_COMMITS=$(git rev-list --count "$MERGE_BASE".."upstream/$UPSTREAM_BRANCH")
            echo "new_commits=$NEW_COMMITS" >> "$GITHUB_OUTPUT"
            echo "$NEW_COMMITS new upstream commits to merge."
          fi

      # -- 3. Attempt merge on staging branch --
      - name: Create staging branch and attempt merge
        if: steps.check.outputs.already_synced != 'true'
        id: merge
        run: |
          DATE_TAG=$(date +%Y%m%d-%H%M%S)
          SYNC_BRANCH="sync/upstream-${DATE_TAG}"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$SYNC_BRANCH" "$LOCAL_BRANCH"
          if git merge "upstream/$UPSTREAM_BRANCH" \
               --no-edit \
               -m "Merge upstream freetz-ng ($(date +%Y-%m-%d))
          Synced with Freetz-NG/freetz-ng@${UPSTREAM_SHA:0:12}
          New upstream commits: ${{ steps.check.outputs.new_commits }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "Merge succeeded without conflicts."
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts detected."
          fi

      # -- 4. Auto-resolve known conflicts --
      - name: Auto-resolve known conflicts
        if: steps.merge.outputs.conflict == 'true'
        id: autoresolve
        run: |
          # UU/AA on AUTO_OURS_FILES: always keep EVO's version.
          AUTO_OURS_FILES=(
            "README.md"
            "docs/juis/README.md"
            "docs/libs/README.md"
            ".github/workflows/github_ghpages.yml"
          )
          # Snapshot git status to a temp file to avoid race conditions
          # when git add/git rm modify the index while iterating.
          git status --porcelain > /tmp/git_status.txt
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            xy="${line:0:2}"
            file="${line:3}"
            if [ "$xy" = "UD" ]; then
              git add -- "$file"
              echo "Auto-resolved (keep-ours): $file"
            elif [ "$xy" = "DU" ]; then
              git rm --quiet -- "$file"
              echo "Auto-resolved (keep-deletion): $file"
            elif [ "$xy" = "UU" ] || [ "$xy" = "AA" ]; then
              for pattern in "${AUTO_OURS_FILES[@]}"; do
                if [[ "$file" == $pattern ]]; then
                  git checkout --ours -- "$file" 2>/dev/null || true
                  if [ -f "$file" ]; then
                    git add -- "$file"
                    echo "Auto-resolved (take-ours): $file"
                  else
                    git rm --quiet -- "$file" 2>/dev/null || true
                    echo "Auto-resolved (keep-deleted): $file"
                  fi
                  break
                fi
              done
            fi
          done < /tmp/git_status.txt
          REMAINING=$(git diff --name-only --diff-filter=U)
          if [ -z "$REMAINING" ]; then
            echo "all_resolved=true" >> "$GITHUB_OUTPUT"
            echo "All conflicts auto-resolved."
          else
            echo "all_resolved=false" >> "$GITHUB_OUTPUT"
            echo "Remaining conflicts: $REMAINING"
          fi

      - name: Continue merge after auto-resolution
        if: steps.autoresolve.outputs.all_resolved == 'true'
        run: |
          if GIT_EDITOR=true git merge --continue; then
            echo "Merge continued after auto-resolution."
          else
            echo "Warning: git merge --continue failed, checking state..."
            git status
            exit 1
          fi

      # -- 5. LLM merge resolution with DeepSeek --
      - name: DeepSeek LLM merge resolution
        if: steps.autoresolve.outputs.all_resolved == 'false'
        id: llm
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_PROMPT: ${{ secrets.DEEPSEEK_PROMPT }}
        run: |
          # Check if secrets are available
          if [ -z "$DEEPSEEK_API_KEY" ] || [ -z "$DEEPSEEK_PROMPT" ]; then
            echo "Missing DEEPSEEK_API_KEY or DEEPSEEK_PROMPT secret."
            echo "llm_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LLM_RESOLVED=0
          LLM_FAILED=0
          LLM_SKIPPED=0

          # File extensions eligible for LLM merging
          is_llm_candidate() {
            case "$1" in
              *.c|*.cc|*.cpp|*.css|*.h|*.html|*.in|*.js|*.json|*.m4|*.md|*.mk|*.php|*.pl|*.py|*.sh|*.txt|*.xml|*.yml|*.yaml)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          process_file() {
            local file="$1"
            echo "LLM resolving: $file"
            base=$(git show :1:"$file" 2>/dev/null || true)
            local_content=$(git show :2:"$file" 2>/dev/null || true)
            remote=$(git show :3:"$file" 2>/dev/null || true)

            # Build JSON payload with a single jq call.
            # --arg passes raw strings; jq handles JSON escaping internally.
            PAYLOAD=$(jq -n \
              --arg model "deepseek-chat" \
              --arg system_content "$DEEPSEEK_PROMPT" \
              --arg base "$base" \
              --arg local "$local_content" \
              --arg remote "$remote" \
              '{
                "model": $model,
                "messages": [
                  {"role": "system", "content": $system_content},
                  {"role": "user", "content": ("Please merge the following file. Apply the rules from the system instructions above.\n\n## Base (common ancestor)\n```\n" + $base + "\n```\n\n## Local (current Freetz-EVO branch)\n```\n" + $local + "\n```\n\n## Remote (incoming upstream branch)\n```\n" + $remote + "\n```\n\nOutput ONLY the final merged file content, without any surrounding markdown, explanations, or code fences.")}
                ],
                "temperature": 0.1,
                "max_tokens": 8192
              }')

            echo "$PAYLOAD" > /tmp/deepseek-payload.json

            # Call DeepSeek API (OpenAI-compatible)
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              https://api.deepseek.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
              -d @/tmp/deepseek-payload.json)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            # Use single quotes for sed to avoid shell variable expansion of $d
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" != "200" ]; then
              echo "DeepSeek API error (HTTP $HTTP_CODE) for $file"
              echo "$BODY" | jq -r '.error.message // "Unknown error"' 2>/dev/null || true
              return 1
            fi
            MERGED=$(echo "$BODY" | jq -r ".choices[0].message.content // empty" 2>/dev/null)
            if [ -z "$MERGED" ]; then
              echo "Empty response from DeepSeek for $file"
              return 1
            fi
            echo "$MERGED" > "$file"
            git add "$file"
            echo "LLM resolved: $file"
            return 0
          }

          # Snapshot conflicted file list to avoid churn during resolution
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if ! is_llm_candidate "$file"; then
              echo "Skipping (not an LLM candidate): $file"
              LLM_SKIPPED=$((LLM_SKIPPED + 1))
              continue
            fi
            if process_file "$file"; then
              LLM_RESOLVED=$((LLM_RESOLVED + 1))
            else
              LLM_FAILED=$((LLM_FAILED + 1))
            fi
          done < /tmp/conflicts.txt

          echo "llm_resolved=$LLM_RESOLVED" >> "$GITHUB_OUTPUT"
          echo "llm_failed=$LLM_FAILED" >> "$GITHUB_OUTPUT"
          echo "llm_skipped=$LLM_SKIPPED" >> "$GITHUB_OUTPUT"
          STILL_CONFLICTED=$(git diff --name-only --diff-filter=U)
          if [ -z "$STILL_CONFLICTED" ]; then
            echo "llm_success=true" >> "$GITHUB_OUTPUT"
            echo "All remaining conflicts resolved by DeepSeek LLM."
          else
            echo "llm_success=false" >> "$GITHUB_OUTPUT"
            echo "Some conflicts remain unresolved by LLM:"
            echo "$STILL_CONFLICTED"
            echo "llm_unresolved<<EOF" >> "$GITHUB_OUTPUT"
            echo "$STILL_CONFLICTED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Continue merge after LLM resolution
        if: steps.llm.outputs.llm_success == 'true'
        run: |
          if GIT_EDITOR=true git merge --continue; then
            echo "Merge continued after LLM resolution."
          else
            echo "Warning: git merge --continue failed, checking state..."
            git status
            exit 1
          fi

      # -- 6. Push merged result to master --
      - name: Push merged result to master
        if: |
          steps.check.outputs.already_synced != 'true' &&
          (steps.merge.outputs.conflict != 'true' ||
           steps.autoresolve.outputs.all_resolved == 'true' ||
           steps.llm.outputs.llm_success == 'true') &&
          github.event.inputs.dry_run != 'true'
        run: |
          git checkout "$LOCAL_BRANCH"
          git merge --ff-only "${{ steps.merge.outputs.sync_branch }}"
          git push --force-with-lease origin "$LOCAL_BRANCH"
          git branch -d "${{ steps.merge.outputs.sync_branch }}" 2>/dev/null || true
          echo "Master updated successfully."

      # -- 7. Abort merge if unresolved conflicts remain --
      - name: Abort merge on unresolved conflicts
        if: |
          steps.check.outputs.already_synced != 'true' &&
          steps.autoresolve.outputs.all_resolved == 'false' &&
          (steps.llm.outputs.llm_success == 'false' || steps.llm.outputs.llm_success == '')
        id: abort
        run: |
          CONFLICTED=$(git diff --name-only --diff-filter=U | head -50)
          CONFLICT_COUNT=$(git diff --name-only --diff-filter=U | wc -l)
          echo "conflicted_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONFLICTED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"
          git merge --abort
          git checkout "$LOCAL_BRANCH"
          echo "Merge aborted. $CONFLICT_COUNT files remain unresolved."

      # -- 8. Create GitHub Issue for unresolved conflicts --
      - name: Create conflict issue
        if: |
          steps.check.outputs.already_synced != 'true' &&
          steps.autoresolve.outputs.all_resolved == 'false' &&
          (steps.llm.outputs.llm_success == 'false' || steps.llm.outputs.llm_success == '')
        uses: actions/github-script@v7
        with:
          script: |
            const conflictedFiles = `${{ steps.abort.outputs.conflicted_files || steps.llm.outputs.llm_unresolved }}`;
            const conflictCount = '${{ steps.abort.outputs.conflict_count }}';
            const upstreamSha = '${{ env.UPSTREAM_SHA }}'.substring(0, 12);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const llmResolved = '${{ steps.llm.outputs.llm_resolved }}';
            const llmFailed = '${{ steps.llm.outputs.llm_failed }}';
            const llmSkipped = '${{ steps.llm.outputs.llm_skipped }}';

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync-conflict',
              per_page: 1,
            });

            let llmSection = '';
            if (llmResolved || llmFailed || llmSkipped) {
              llmSection = `\n### DeepSeek LLM resolution summary\n- Resolved: ${llmResolved}\n- Failed: ${llmFailed}\n- Skipped: ${llmSkipped}\n`;
            }

            const title = `Upstream sync conflict (${new Date().toISOString().split('T')[0]})`;
            const body = `## Upstream sync failed - merge conflicts detected

            **Upstream commit:** \`Freetz-NG/freetz-ng@${upstreamSha}\`
            **Conflicting files:** ${conflictCount}
            **Workflow run:** [View logs](${runUrl})
            ${llmSection}
            ### Unresolved conflicted files
            \`\`\`
            ${conflictedFiles}
            \`\`\`

            ### Resolution steps

            \`\`\`bash
            # 1. Fetch upstream
            git fetch upstream master
            # 2. Update your local upstream-mirror
            git checkout upstream-mirror
            git reset --hard upstream/master
            # 3. Create a sync branch from master
            git checkout master
            git checkout -b sync/manual-$(date +%Y%m%d)
            # 4. Merge and resolve conflicts
            git merge upstream-mirror
            # ... resolve conflicts ...
            git add .
            git merge --continue
            # 5. Verify everything builds
            # make menuconfig && make
            # 6. Merge into master
            git checkout master
            git merge --ff-only sync/manual-$(date +%Y%m%d)
            git push origin master
            # 7. Close this issue
            \`\`\`

            > **Note:** \`master\` was NOT modified. It remains clean and stable.
            `;

            if (existingIssues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                body: body,
              });
              console.log(`Updated existing issue #${existingIssues.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['upstream-sync-conflict'],
              });
              console.log('Created new conflict issue.');
            }

      # -- 9. Summary --
      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.already_synced }}" = "true" ]; then
            echo "Already up-to-date with upstream." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.llm.outputs.llm_success }}" = "true" ]; then
            echo "Merged ${{ steps.check.outputs.new_commits }} upstream commits (with DeepSeek LLM resolution)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Category | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| LLM resolved | ${{ steps.llm.outputs.llm_resolved }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| LLM failed | ${{ steps.llm.outputs.llm_failed }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| LLM skipped | ${{ steps.llm.outputs.llm_skipped }} |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.autoresolve.outputs.all_resolved }}" = "true" ]; then
            echo "Merged ${{ steps.check.outputs.new_commits }} upstream commits into master." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            echo "Merge conflicts detected in ${{ steps.abort.outputs.conflict_count }} files." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A GitHub Issue has been created with resolution instructions." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.abort.outputs.conflicted_files }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merged ${{ steps.check.outputs.new_commits }} upstream commits into master." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: \`${UPSTREAM_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
