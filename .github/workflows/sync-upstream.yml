# .github/workflows/sync-upstream.yml
#
# Sync freetz-evo with upstream Freetz-NG/freetz-ng
#

name: Sync Upstream freetz-ng

on:
  #schedule:
  #  - cron: '0 6 * * 1'          # every Monday at 06:00 UTC
  workflow_dispatch:               # manual trigger from Actions tab
    inputs:
      dry_run:
        description: 'Dry run (do not push to master)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      llm_provider:
        description: 'LLM provider for conflict resolution (openai|anthropic)'
        required: false
        default: 'openai'
        type: choice
        options:
          - 'openai'
          - 'anthropic'
      llm_model:
        description: 'LLM model override (default: gpt-4o / claude-sonnet-4-20250514)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/Freetz-NG/freetz-ng.git
      UPSTREAM_BRANCH: master
      LOCAL_BRANCH: master
      MIRROR_BRANCH: upstream-mirror

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.LOCAL_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "freetz-evo-bot"
          git config user.email "freetz-evo-bot@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || true
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags
          echo "UPSTREAM_SHA=$(git rev-parse upstream/$UPSTREAM_BRANCH)" >> "$GITHUB_ENV"
          echo "Upstream HEAD: $(git rev-parse --short upstream/$UPSTREAM_BRANCH)"

      # ── 1. Update upstream-mirror branch ──────────────────────────
      - name: Update upstream-mirror branch
        run: |
          # Create or reset upstream-mirror to match upstream exactly
          if git show-ref --verify --quiet "refs/heads/$MIRROR_BRANCH"; then
            git branch -f "$MIRROR_BRANCH" "upstream/$UPSTREAM_BRANCH"
          else
            git branch "$MIRROR_BRANCH" "upstream/$UPSTREAM_BRANCH"
          fi
          # Push upstream-mirror; may be rejected for workflow files (GITHUB_TOKEN limitation)
          git push origin "$MIRROR_BRANCH" --force-with-lease 2>&1 || echo "Warning: upstream-mirror push failed (workflow files require PAT)"

      # ── 2. Check if sync is needed ───────────────────────────────
      - name: Check if already up-to-date
        id: check
        run: |
          MERGE_BASE=$(git merge-base "$LOCAL_BRANCH" "upstream/$UPSTREAM_BRANCH")
          UPSTREAM_HEAD=$(git rev-parse "upstream/$UPSTREAM_BRANCH")

          if [ "$MERGE_BASE" = "$UPSTREAM_HEAD" ]; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "✅ Already up-to-date with upstream."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            # Count new upstream commits
            NEW_COMMITS=$(git rev-list --count "$MERGE_BASE".."upstream/$UPSTREAM_BRANCH")
            echo "new_commits=$NEW_COMMITS" >> "$GITHUB_OUTPUT"
            echo "📦 $NEW_COMMITS new upstream commits to merge."
          fi

      # ── 3. Attempt merge on staging branch ──────────────────────
      - name: Create staging branch and attempt merge
        if: steps.check.outputs.already_synced != 'true'
        id: merge
        run: |
          DATE_TAG=$(date +%Y%m%d-%H%M%S)
          SYNC_BRANCH="sync/upstream-${DATE_TAG}"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

          # Create staging branch from current master
          git checkout -b "$SYNC_BRANCH" "$LOCAL_BRANCH"

          # Attempt merge
          if git merge "upstream/$UPSTREAM_BRANCH" \
               --no-edit \
               -m "Merge upstream freetz-ng ($(date +%Y-%m-%d))

          Synced with Freetz-NG/freetz-ng@${UPSTREAM_SHA:0:12}
          New upstream commits: ${{ steps.check.outputs.new_commits }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then

            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "✅ Merge succeeded without conflicts."
          else
            # ── Auto-resolve known classes of conflict ─────────────────────
            # UU/AA on AUTO_OURS_FILES: both bots updated the same auto-generated
            # file (e.g. docs/juis/README.md).  Always keep EVO's version.
            # Files deleted by us but re-added by upstream are also handled.
            AUTO_OURS_FILES=(
              "README.md"
              "docs/juis/README.md"
              "docs/libs/README.md"
              ".github/workflows/github_ghpages.yml"
            )
            # Snapshot to temp file to avoid race conditions
            git status --porcelain > /tmp/git_status.txt
            while IFS= read -r line; do
              xy="${line:0:2}"
              file="${line:3}"
              if [ "$xy" = "UD" ]; then
                git add -- "$file"
              elif [ "$xy" = "DU" ]; then
                git rm --quiet -- "$file"
              elif [ "$xy" = "UU" ] || [ "$xy" = "AA" ]; then
                for pattern in "${AUTO_OURS_FILES[@]}"; do
                  if [[ "$file" == $pattern ]]; then
                    git checkout --ours -- "$file" 2>/dev/null || true
                    if [ -f "$file" ]; then
                      git add -- "$file"
                      echo "⚙️  Auto-resolved (take-ours): $file"
                    else
                      git rm --quiet -- "$file" 2>/dev/null || true
                      echo "⚙️  Auto-resolved (keep-deleted): $file"
                    fi
                    break
                  fi
                done
              fi
            done < /tmp/git_status.txt

            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -z "$REMAINING" ]; then
              GIT_EDITOR=true git merge --continue
              echo "conflict=false" >> "$GITHUB_OUTPUT"
              echo "✅ All conflicts auto-resolved."
            else
              echo "conflict=true" >> "$GITHUB_OUTPUT"

              # Collect conflicted files for the issue
              CONFLICTED=$(git diff --name-only --diff-filter=U | head -50)
              echo "conflicted_files<<EOF" >> "$GITHUB_OUTPUT"
              echo "$CONFLICTED" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"

              CONFLICT_COUNT=$(git diff --name-only --diff-filter=U | wc -l)
              echo "conflict_count=$CONFLICT_COUNT" >> "$GITHUB_OUTPUT"

              echo "❌ Merge conflicts detected in $CONFLICT_COUNT files."

              # In dry-run mode abort immediately (no LLM resolution, no push).
              if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
                git merge --abort
              fi
              # NOTE: for real runs the merge is intentionally left in progress
              # so the LLM resolution step can resolve it on the staging branch.
              # If LLM resolution is unavailable or fails, that step aborts the
              # merge and a GitHub Issue is created instead.
            fi
          fi

      # ── 4a. Resolve remaining conflicts via LLM ───────────────────
      - name: Resolve conflicts via LLM
        if: |
          steps.check.outputs.already_synced != 'true' &&
          steps.merge.outputs.conflict == 'true' &&
          github.event.inputs.dry_run != 'true'
        id: llm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'openai' }}
          LLM_MODEL: ${{ github.event.inputs.llm_model }}
          GIT_EDITOR: 'true'
        run: |
          set -uo pipefail

          # Fall back to issue creation when no LLM API key is configured.
          if [ "$LLM_PROVIDER" = "openai" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "⚠ No OPENAI_API_KEY configured - aborting merge."
            echo "llm_resolved=false" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi
          if [ "$LLM_PROVIDER" = "anthropic" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "⚠ No ANTHROPIC_API_KEY configured - aborting merge."
            echo "llm_resolved=false" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi

          python3 - <<'PYEOF'
          import json, os, subprocess, sys, urllib.request, urllib.error

          provider = os.environ.get("LLM_PROVIDER", "openai").strip().lower()
          model = os.environ.get("LLM_MODEL", "").strip()

          def git(*args):
              return subprocess.run(["git"] + list(args), capture_output=True, text=True)

          def llm_call(system_prompt, user_prompt):
              if provider == "openai":
                  key = os.environ["OPENAI_API_KEY"]
                  url = "https://api.openai.com/v1/chat/completions"
                  payload = {
                      "model": model or "gpt-4o",
                      "temperature": 0.2,
                      "messages": [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": user_prompt},
                      ],
                  }
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type": "application/json",
                               "Authorization": "Bearer " + key})
                  with urllib.request.urlopen(req, timeout=300) as resp:
                      data = json.loads(resp.read().decode())
                  return data["choices"][0]["message"]["content"]
              elif provider == "anthropic":
                  key = os.environ["ANTHROPIC_API_KEY"]
                  url = "https://api.anthropic.com/v1/messages"
                  payload = {
                      "model": model or "claude-sonnet-4-20250514",
                      "max_tokens": 8192,
                      "system": system_prompt,
                      "messages": [{"role": "user", "content": user_prompt}],
                  }
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type": "application/json",
                               "x-api-key": key,
                               "anthropic-version": "2023-06-01"})
                  with urllib.request.urlopen(req, timeout=300) as resp:
                      data = json.loads(resp.read().decode())
                  return data["content"][0]["text"]
              raise RuntimeError("Unsupported LLM_PROVIDER: " + provider)

          SYSTEM = (
              "You are an expert merge-conflict resolver for the freetz-evo project, a "
              "fork of Freetz-NG/freetz-ng (embedded Linux firmware build system). "
              "Merge the given base/local/remote file versions into a single correct "
              "result that preserves both sides."
          )

          def build_prompt(path, base, local, remote):
              return ("File: " + path + "\n\n"
                  "Merge the three-way conflict below. Return ONLY the final merged file "
                  "content, no commentary, no markdown fences.\n\n"
                  "RULES:\n"
                  "- Keep upstream bug fixes unless they directly conflict with an "
                  "intentional Freetz-EVO customization.\n"
                  "- Keep Freetz-EVO-specific behavior unless upstream already provides "
                  "an equivalent implementation.\n"
                  "- Remove duplicate comments, duplicate branches, and duplicate list "
                  "entries after merging both sides.\n"
                  "- Preserve shell syntax, quoting style, and the surrounding file "
                  "structure.\n"
                  "- For config/menu files (Config.in, *.libs), keep the local EVO menu "
                  "placement unless upstream adds genuinely new entries.\n\n"
                  "===== BASE =====\n" + base + "\n"
                  "===== LOCAL (Freetz-EVO) =====\n" + local + "\n"
                  "===== REMOTE (upstream) =====\n" + remote + "\n")

          conflicted = git("diff", "--name-only", "--diff-filter=U").stdout.split()
          failed = []
          for path in conflicted:
              base = git("show", ":1:" + path).stdout
              local = git("show", ":2:" + path).stdout
              remote = git("show", ":3:" + path).stdout
              try:
                  merged = llm_call(SYSTEM, build_prompt(path, base, local, remote))
                  merged = merged.strip()
                  # strip possible markdown fences
                  if merged.startswith("```"):
                      lines = merged.splitlines()
                      if lines and lines[0].startswith("```"):
                          lines = lines[1:]
                      if lines and lines[-1].startswith("```"):
                          lines = lines[:-1]
                      merged = "\n".join(lines).strip()
                  with open(path, "w", encoding="utf-8") as fh:
                      fh.write(merged + "\n")
                  git("add", path)
                  print("✅ Resolved via LLM: " + path)
              except Exception as e:
                  failed.append(path)
                  print("❌ LLM failed for " + path + ": " + str(e))

          if failed:
              print("LLM_FAILED_FILES: " + ", ".join(failed))
              sys.exit(1)

          # Check if any conflicts remain (e.g. git add may not have cleared them)
          remaining = git("diff", "--name-only", "--diff-filter=U").stdout.split()
          if remaining:
              print("LLM_FAILED_FILES: " + ", ".join(remaining))
              sys.exit(1)

          # Continue the merge
          rc = git("merge", "--continue")
          if rc.returncode != 0:
              print("❌ merge --continue failed: " + rc.stderr)
              sys.exit(1)
          print("✅ Merge continued after LLM resolution")
          PYEOF

          if [ $? -eq 0 ]; then
            echo "llm_resolved=true" >> "$GITHUB_OUTPUT"
            echo "🎉 All conflicts resolved via LLM."
          else
            echo "llm_resolved=false" >> "$GITHUB_OUTPUT"
            echo "❌ LLM resolution failed - aborting merge."
            git merge --abort || true
          fi

      # ── 4b. Success: create Pull Request ─────────────────────────
      - name: Push sync branch to origin
        if: |
          steps.check.outputs.already_synced != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          (steps.merge.outputs.conflict != 'true' || steps.llm.outputs.llm_resolved == 'true')
        run: |
          # Push the sync branch so a PR can be created from it
          git push origin "${{ steps.merge.outputs.sync_branch }}"

      - name: Create Pull Request
        if: |
          steps.check.outputs.already_synced != 'true' &&
          github.event.inputs.dry_run != 'true' &&
          (steps.merge.outputs.conflict != 'true' || steps.llm.outputs.llm_resolved == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const syncBranch = '${{ steps.merge.outputs.sync_branch }}';
            const newCommits = '${{ steps.check.outputs.new_commits }}';
            const upstreamSha = '${{ env.UPSTREAM_SHA }}'.substring(0, 12);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync upstream freetz-ng (${new Date().toISOString().split('T')[0]})`,
              head: syncBranch,
              base: '${{ env.LOCAL_BRANCH }}',
              body: `Upstream merge (Freetz-NG/freetz-ng@${upstreamSha})
              New commits: ${newCommits}
              Workflow run: ${runUrl}

              This PR was created automatically. Review and merge manually.`,
            });
            console.log(`Created PR #${pr.data.number}: ${pr.data.html_url}`);

      - name: Dry run notice
        if: |
          steps.check.outputs.already_synced != 'true' &&
          steps.merge.outputs.conflict != 'true' &&
          github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN: merge succeeded but no PR was created."
          echo "  Sync branch: ${{ steps.merge.outputs.sync_branch }}"
          echo "  New commits:  ${{ steps.check.outputs.new_commits }}"
          echo "  To create a PR manually:"
          echo "    git push origin ${{ steps.merge.outputs.sync_branch }}"
          echo "    gh pr create --base master --head ${{ steps.merge.outputs.sync_branch }}"

      # ── 4c. Conflict (unresolved by LLM): create GitHub Issue ───
      - name: Create conflict issue
        if: |
          steps.check.outputs.already_synced != 'true' &&
          steps.merge.outputs.conflict == 'true' &&
          steps.llm.outputs.llm_resolved != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const conflictedFiles = `${{ steps.merge.outputs.conflicted_files }}`;
            const conflictCount = '${{ steps.merge.outputs.conflict_count }}';
            const upstreamSha = '${{ env.UPSTREAM_SHA }}'.substring(0, 12);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Check if there's already an open sync conflict issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync-conflict',
              per_page: 1,
            });

            const title = `⚠️ Upstream sync conflict (${new Date().toISOString().split('T')[0]})`;
            const body = `## Upstream sync failed — merge conflicts detected

            **Upstream commit:** \`Freetz-NG/freetz-ng@${upstreamSha}\`
            **Conflicting files:** ${conflictCount}
            **Workflow run:** [View logs](${runUrl})

            ### Conflicted files
            \`\`\`
            ${conflictedFiles}
            \`\`\`

            ### Resolution steps

            \`\`\`bash
            # 1. Fetch upstream
            git fetch upstream master

            # 2. Update your local upstream-mirror
            git checkout upstream-mirror
            git reset --hard upstream/master

            # 3. Create a sync branch from master
            git checkout master
            git checkout -b sync/manual-$(date +%Y%m%d)

            # 4. Merge and resolve conflicts
            git merge upstream-mirror
            # ... resolve conflicts ...
            git add .
            git merge --continue

            # 5. Verify everything builds
            # make menuconfig && make

            # 6. Merge into master
            git checkout master
            git merge --ff-only sync/manual-$(date +%Y%m%d)
            git push origin master

            # 7. Close this issue
            \`\`\`

            > **Note:** \`master\` was NOT modified. It remains clean and stable.
            `;

            if (existingIssues.data.length > 0) {
              // Update existing issue with new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                body: body,
              });
              console.log(`Updated existing issue #${existingIssues.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['upstream-sync-conflict'],
              });
              console.log('Created new conflict issue.');
            }

      # ── 5. Summary ──────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.check.outputs.already_synced }}" = "true" ]; then
            echo "✅ **Already up-to-date** with upstream." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.merge.outputs.conflict }}" = "true" ] && [ "${{ steps.llm.outputs.llm_resolved }}" = "true" ]; then
            echo "✅ **Merge conflicts resolved via LLM** (${{ steps.merge.outputs.conflict_count }} files) -- PR created for review." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            echo "❌ **Merge conflicts** detected in ${{ steps.merge.outputs.conflict_count }} files." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A GitHub Issue has been created with resolution instructions." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.merge.outputs.conflicted_files }}" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **Merged ${{ steps.check.outputs.new_commits }} upstream commits** -- PR created for review." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: \`${UPSTREAM_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
