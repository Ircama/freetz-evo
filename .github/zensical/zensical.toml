[project]
site_name = "Freetz-EVO Documentation"
site_description = "Freetz-EVO firmware modification for ​AVM devices like FRITZ!Box"
site_author = "Freetz-EVO"
site_url = "https://ircama.github.io/freetz-evo/"
site_dir = "site"
repo_url = "https://github.com/Ircama/freetz-evo"
edit_uri = "../freetz-evo/blob/master/docs/"
docs_dir = "docs"
copyright = '&copy <span>Freetz-EVO</span><br/><span>Licensed under <a href="https://github.com/Ircama/freetz-evo/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">EUPL-1.2</a></span><br/>'
extra_css = ["extra.css"]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
    "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js",
    "javascripts/mermaid-init.js",
    "javascripts/toc-toggle.js",
]

[project.extra]
generator = false

[project.theme]
variant = "classic"

favicon = "screenshots/000-TAG_freetz-evo.png"
logo = "screenshots/000-TAG_freetz-evo.png"
language = "en"

features = [
    "navigation.top",
    "navigation.instant",
    "navigation.indexes",
    "search.suggest",
    "search.highlight",
    "search.share",
    "content.action.edit",
    "content.code.copy",
]

[project.theme.font]
text = "Noto Sans Lisu"
code = "Roboto Mono"

[[project.theme.palette]]
scheme = "default"
media = "(prefers-color-scheme: light)"
primary = "blue grey"
accent = "blue grey"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
media = "(prefers-color-scheme: dark)"
primary = "blue grey"
accent = "blue grey"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Ircama/freetz-evo"
name = "GitHub"

[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
title = "TOC"
permalink = "⚓︎"
permalink_title = "Permalink"

[project.markdown_extensions.fenced_code]

[project.markdown_extensions.def_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.nl2br]

[project.markdown_extensions.admonition]

[project.markdown_extensions."pymdownx.caret"]

[project.markdown_extensions."pymdownx.mark"]

[project.markdown_extensions."pymdownx.tilde"]

[project.markdown_extensions."pymdownx.tasklist"]

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.snippets"]
base_path = ["."]
check_paths = true

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.emoji"]

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
    {name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format"},
]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = "true"
