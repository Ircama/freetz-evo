export MPD_ENABLED='no'
export MPD_CONFIG_DIR='/var/media/ftp/MediaServer/mpd'
export MPD_MUSIC_DIR='/var/media/ftp/MediaServer'
export MPD_BIND_TO_ADDRESS='0.0.0.0'
export MPD_PORT='6600'
export MPD_ALSA_OUTPUT_NAME='ALSA Output'
# ALSA device: "hw:0,0" = first card, first device (direct, no resampling/mixer).
#            "default" = use system default PCM (may resample/mix via plug).
# Use 'arecord -l' to list cards, 'aplay -l' for playback devices.
export MPD_ALSA_DEVICE='hw:0,0'
# Mixer type: "hardware" = use hardware mixer (requires mixer_device/control),
#             "software" = software volume (PCM, works with any device),
#             "none"     = no volume control (e.g. fixed-volume DAC).
export MPD_MIXER_TYPE='software'
export MPD_MIXER_DEVICE=''
export MPD_MIXER_CONTROL=''
export MPD_AUDIO_FORMAT=''
export MPD_AUTO_UPDATE='yes'
export MPD_RESTORE_PAUSED='yes'
export MPD_LOG_LEVEL='notice'