# MiniUPnPd default config
# This file is deployed as /etc/default.miniupnpd/miniupnpd.conf

# WAN interface (Internet-facing)
ext_ifname=eth1

# LAN interface (internal network)
listening_ip=192.168.0.1/24

# Enable UPnP
enable_upnp=yes

# Enable NAT-PMP / PCP
enable_pcp_pmp=yes

# Secure mode: only allow mappings to the client's own IP
secure_mode=yes

# Lease persistence file
lease_file=/var/log/upnp.leases

# SSDP notify interval (seconds)
notify_interval=900

# Clean up stale rules every N seconds
clean_ruleset_interval=600

# Report system uptime instead of process uptime
system_uptime=yes

# Permission rules: allow by default for LAN
allow 1024-65535 192.168.0.0/24 1024-65535
deny 0-65535 0.0.0.0/0 0-65535
