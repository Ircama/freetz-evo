# OpenThread Border Router (otbr-agent) - default configuration of the freetz
# configuration framework.
#
# Every variable must be exported, otherwise the web interface shows no field
# for it and the value is never saved. Values changed by the user are stored in
# /mod/etc/conf/otbr.cfg and override the defaults below.

# Start otbr-agent when the box boots (yes/no)
export OTBR_ENABLED='no'

# Infrastructure (backbone) interface with an IPv6 address and IPv6 forwarding.
# On a Fritz!Box br0 is the LAN bridge, wlan0 is the 2.4 GHz WLAN interface.
export OTBR_INFRA_IF='br0'

# spinel URL of the Radio Co-Processor, e.g.
#   spinel+hdlc+uart:///dev/ttyACM0        USB dongle (nRF52840 RCP firmware)
#   spinel+hdlc+uart:///dev/ttyUSB0        USB serial adapter
#   spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=1000000
export OTBR_RADIO_URL='spinel+hdlc+uart:///dev/ttyACM0'

# Verbosity level passed to otbr-agent with -d (0 = highest, 7 = all); empty
# selects the built-in default.
export OTBR_LOG_LEVEL=''

# Seconds to wait for the RCP device when starting at boot. The wait runs in the
# background and never blocks the boot sequence. 0 = start immediately.
export OTBR_CONFIG_WAIT='120'

# Additional otbr-agent command line options, for example
# '-v' (verbose) or '-B eth0' (backbone interface)
export OTBR_EXTRA_ARGS=''
