# ===========================================================================
# aria2 Default Configuration
# ===========================================================================
# Only parameters used by the web interface CGI and init scripts.
# Other aria2 settings are configured directly in aria2.conf.

# ===========================================================================
# System Configuration (used by init scripts and framework)
# ===========================================================================
export ARIA2_ENABLED='no'           # Autostart on boot: 'yes' or 'no'
export ARIA2_BASEDIR=''             # Base directory (e.g. /var/media/ftp/aria2)
export ARIA2_NICE='10'              # Process priority: -20 (highest) to 19 (lowest)
export ARIA2_CONFIG_WAIT='120'      # Boot wait time: seconds to wait for USB/network at boot
                                    # 0 = immediate synchronous start (for internal storage only)
                                    # >0 = background async start with wait (for USB drives/NAS)
export ARIA2_BOOT_MONITOR='yes'     # Monitor at boot: if 'yes', watch process and restart if it dies
export ARIA2_BOOT_MONITOR_INTERVAL='10'   # Monitor interval (seconds)
export ARIA2_BOOT_MONITOR_DURATION='300'  # Monitor duration (seconds)

# ===========================================================================
# Runtime Configuration (written to aria2.conf by aria2.save)
# Note: These are exported so the framework can collect them from POST,
# but they are ONLY written to aria2.conf by aria2.save, not used by init scripts
# ===========================================================================

# RPC settings
export ARIA2_RPC_ENABLED='yes'      # Enable JSON-RPC interface: 'yes' or 'no'
export ARIA2_RPC_PORT='6800'        # JSON-RPC listen port (default: 6800)
export ARIA2_RPC_LISTEN_ALL='yes'   # Listen on all interfaces: 'yes' or 'no'
export ARIA2_RPC_SECRET=''          # RPC secret token (empty = no auth)

# Download settings
export ARIA2_MAX_CONCURRENT='5'     # Max concurrent downloads
export ARIA2_MAX_CONN_SERVER='16'   # Max connections per server per download
export ARIA2_SPLIT='5'              # Number of parallel splits per download
export ARIA2_MIN_SPLIT_SIZE='20M'   # Min size of each split (e.g., 20M)

# Speed limits (0 = unlimited)
export ARIA2_MAX_DL_LIMIT='0'       # Max overall download rate (KB/s, 0=unlimited)
export ARIA2_MAX_UL_LIMIT='0'       # Max overall upload rate (KB/s, 0=unlimited)

# BitTorrent settings
export ARIA2_BT_ENABLED='yes'       # Enable BitTorrent support: 'yes' or 'no'
export ARIA2_SEED_RATIO='1.0'       # Seeding ratio (0.0 = always seed, negative = seed indefinitely)
export ARIA2_SEED_TIME='0'          # Seeding time in minutes (0 = unlimited)
export ARIA2_BT_MAX_PEERS='55'      # Max number of peers per torrent (0 = unlimited)
export ARIA2_DHT_ENABLED='yes'      # Enable DHT: 'yes' or 'no'
export ARIA2_DHT_PORT='6881'        # DHT listen port

# Logging
export ARIA2_LOGLEVEL='notice'      # Log level: error, warn, notice, info, debug

# DNS
export ARIA2_ASYNCDNS='yes'         # Use async DNS (libcares): 'yes' or 'no'
                                    # Set to 'no' if built without libcares
