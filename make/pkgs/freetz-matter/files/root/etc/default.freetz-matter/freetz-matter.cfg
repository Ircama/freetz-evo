# freetz-matter -- FRITZ!Box as a Matter device: default setup.
#
# Every variable must be exported, otherwise the web interface shows no field
# for it and the value is never saved. Values changed by the user are stored in
# /mod/etc/conf/freetz-matter.cfg and override the defaults below.

# Start the Matter device when the box boots (yes/no)
export FREETZ_MATTER_ENABLED='no'

# Matter UDP port. 5540 is the standard Matter port; change it only if another
# Matter stack already listens on the box (for example ot-br-posix, which does
# not use it, or a second instance of this daemon).
export FREETZ_MATTER_PORT='5540'

# Fabric store: commissioned fabrics, ACLs and subscription state.
# The configuration page lists the writable disks of the box and moves the
# existing content over when the path changes. /tmp/flash is a ramdisk that is
# archived to the box flash by modsave (on stop and on every save); a directory
# on a disk, for example /var/media/ftp/<disk>/freetz-matter, also survives a
# power cut - without the fabric the box has to be commissioned again.
export FREETZ_MATTER_STORE='/tmp/flash/freetz-matter'

# Seconds to wait for the daemon binary when it lives on external storage (the
# package can be externalized): the boot sequence waits for it in a background
# subshell and is never blocked. 0 disables the wait.
export FREETZ_MATTER_CONFIG_WAIT='120'

# Debug logging (yes/no). Log goes to /tmp/rc.freetz-matter.log and is visible
# in the web UI under Status -> Logs.
export FREETZ_MATTER_VERBOSE='no'

# Additional command line options, for example '-d /tmp/freetz-matter' to use a
# volatile store while testing.
export FREETZ_MATTER_EXTRA_ARGS=''
