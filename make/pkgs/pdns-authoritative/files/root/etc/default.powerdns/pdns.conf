# PowerDNS Authoritative Server sample configuration for freetz.
#
# This package defaults to the upstream minimal mode, so no backend is active
# unless you selected and configured one explicitly.
#
# Uncomment and adapt one backend compiled into your image:
#
# launch=bind
# bind-config=/tmp/flash/powerdns/named.conf
#
# launch=pipe
# pipe-command=/tmp/flash/powerdns/backend.sh
#
# launch=gsqlite3
# gsqlite3-database=/tmp/flash/powerdns/pdns.sqlite3
#
# launch=gmysql
# gmysql-host=127.0.0.1
# gmysql-dbname=pdns
# gmysql-user=pdns
# gmysql-password=change-me
#
# launch=geoip
# geoip-database-files=/tmp/flash/powerdns/GeoLite2-City.mmdb
#
# launch=lua2
# lua-filename=/tmp/flash/powerdns/backend.lua
#
# launch=remote
# remote-connection-string=unix:path=/tmp/flash/powerdns/remote.sock

setuid=pdns
setgid=pdns
daemon=no
guardian=no
disable-syslog=no
socket-dir=/var/run/pdns
local-address=127.0.0.1
local-port=5300

# Keep the API disabled in the default sample. Enable it explicitly if you need it.
api=no
webserver=no