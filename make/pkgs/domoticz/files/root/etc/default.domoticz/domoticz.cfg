# Domoticz default configuration (freetz configuration framework)
#
# Every variable must be exported, otherwise the web interface shows no field
# for it and the value is never saved. Values changed by the user are stored in
# /mod/etc/conf/domoticz.cfg and override the defaults below.

# Start the Domoticz daemon when the box boots (yes/no)
export DOMOTICZ_ENABLED='no'

# Folder for the database (domoticz.db), its logs and the self signed SSL
# certificate. Use persistent storage (USB stick or NAS), otherwise all data is
# lost on reboot.
export DOMOTICZ_USERDATA='/var/media/ftp/domoticz'

# Port of the web interface (1-49151, 0 disables the HTTP server)
export DOMOTICZ_WWW_PORT='8080'

# Port of the HTTPS web interface (1-49151, 0 disables HTTPS). The certificate
# is created automatically inside DOMOTICZ_USERDATA on the first start.
export DOMOTICZ_SSL_PORT='0'

# Value passed to the Domoticz option -loglevel. Empty selects the built-in
# default.
export DOMOTICZ_LOGLEVEL=''

# Seconds to wait for DOMOTICZ_USERDATA when starting at boot (USB stick, NAS).
# The wait runs in the background and never blocks the boot sequence.
# 0 = start immediately.
export DOMOTICZ_CONFIG_WAIT='120'

# Additional Domoticz command line options, for example
# '-wwwbind 0.0.0.0 -weblog /var/log/domoticz_access.log'
export DOMOTICZ_EXTRA_ARGS=''
