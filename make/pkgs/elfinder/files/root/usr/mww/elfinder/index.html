<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
	<title>elFinder – FritzBox File Manager</title>

	<!-- elFinder CSS -->
	<link rel="stylesheet" type="text/css" href="css/elfinder.full.css">
	<link rel="stylesheet" type="text/css" href="css/theme.css">

	<!-- Optional 3rd-party theme: loaded dynamically based on ELFINDER_THEME config or localStorage -->
	<link rel="stylesheet" type="text/css" id="elfinder-theme-css" href="">

	<!-- jQuery and jQuery UI (required by elFinder) -->
	<link rel="stylesheet" type="text/css" href="css/jquery-ui.min.css">
	<script src="js/jquery.min.js"></script>
	<script src="js/jquery-ui.min.js"></script>

	<!-- elFinder core -->
	<script src="js/elfinder.full.js"></script>

	<!-- i18n: loaded dynamically below based on browser language -->

	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
		}
		#elfinder-container {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100vw !important;
			height: 100vh !important;
			height: 100dvh !important;
			max-width: 100vw;
			max-height: 100vh;
			max-height: 100dvh;
			overflow: hidden;
			touch-action: manipulation;
		}

		/* ── Fix: jQuery UI dialogs must float above the container ──────────
		   By default elFinder appends dialogs inside its own element and
		   positions them with `absolute`, which can put them outside the
		   visible viewport.  `fixed` ensures they are always relative to
		   the browser window, never off-screen on first open. */
		.ui-dialog {
			position: fixed !important;
		}
		.ui-dialog .ui-dialog-titlebar {
			touch-action: none;
			cursor: move;
		}

		/* ── Skin panel (position set dynamically near toolbar button) ───── */
		#ef-skin-panel {
			position: fixed;
			z-index: 9991;
			background: #fff;
			border: 1px solid #ccc;
			border-radius: 5px;
			padding: 10px 12px;
			box-shadow: 0 3px 10px rgba(0,0,0,.18);
			display: none;
			min-width: 180px;
			font-size: 13px;
			font-family: sans-serif;
		}
		#ef-skin-panel label {
			display: block;
			font-weight: bold;
			color: #555;
			margin-bottom: 5px;
		}
		#ef-skin-select {
			width: 100%;
			padding: 3px 5px;
			margin-bottom: 8px;
			border: 1px solid #ccc;
			border-radius: 3px;
		}
		#ef-skin-panel hr { margin: 6px 0; border: none; border-top: 1px solid #eee; }
		#ef-skin-panel a {
			display: block;
			font-size: 12px;
			color: #337ab7;
			text-decoration: none;
			padding: 2px 0;
		}
		#ef-skin-panel a:hover { text-decoration: underline; }

		/* ── MediaInfo output in info dialog ─────────────────────────────── */
		.elfinder-info-mediainfo pre {
			white-space: pre-wrap;
			word-break: break-word;
			font-size: 0.78em;
			line-height: 1.4;
			margin: 4px 0 0 0;
			padding: 6px 8px;
			background: #f8f8f8;
			border: 1px solid #e0e0e0;
			border-radius: 3px;
			max-height: 280px;
			overflow-y: auto;
		}

		/* ── Statusbar font ──────────────────────────────────────────────── */
		.elfinder .elfinder-statusbar {
			color: #555;
			font-size: small;
		}

		/* ── Custom toolbar button icons ─────────────────────────────────── */
		/* Reset the elfinder sprite background and render the icon via CSS  */
		/* content so it is not overridden by the default sprite fallback.   */
		.elfinder-button-icon-skin,
		.elfinder-button-icon-mediainfo,
		.elfinder-button-icon-movieinfo,
		.elfinder-button-icon-vlc,
		.elfinder-button-icon-videoplayer {
			background: none !important;
			display: flex !important;
			align-items: center !important;
			justify-content: center !important;
		}
		.elfinder-button-icon-skin::before     { content: '🎨'; font-size: 15px; line-height: 1; }
		.elfinder-button-icon-mediainfo::before { content: '🎬'; font-size: 15px; line-height: 1; }
		.elfinder-button-icon-movieinfo::before { content: '🎞️'; font-size: 15px; line-height: 1; }
		.elfinder-button-icon-vlc::before      { content: '📺'; font-size: 15px; line-height: 1; }
		.elfinder-button-icon-videoplayer::before { content: '▶'; font-size: 13px; font-weight: 700; line-height: 1; }

		/* Keep custom toolbar buttons aligned like core ones when labels are shown. */
		#ef-skin-btn,
		#ef-mediainfo-btn,
		#ef-movieinfo-btn,
		#ef-vlc-btn,
		#ef-videoplayer-btn {
			display: inline-flex !important;
			align-items: center !important;
			gap: 4px;
			white-space: nowrap !important;
		}
		#ef-skin-btn .elfinder-button-text,
		#ef-mediainfo-btn .elfinder-button-text,
		#ef-movieinfo-btn .elfinder-button-text,
		#ef-vlc-btn .elfinder-button-text,
		#ef-videoplayer-btn .elfinder-button-text {
			white-space: nowrap !important;
			line-height: 1.2 !important;
		}

		/* Search box controls */
		.elfinder .elfinder-button-search-menu {
			font-size: 10pt !important;
			text-align: center;
			width: auto;
			/* min-width: 180px; */
			position: absolute;
			/* top: 30px; */
			padding-right: 5px;
			padding-left: 5px;
		}

		.ef-movieinfo-popup {
			min-height: 90px;
			max-height: calc(100vh - 180px);
			overflow-y: auto;
			overflow-x: hidden;
			padding-right: 2px;
		}
		.ef-movieinfo-popup .elfinder-spinner { margin: 18px auto; display: block; }
		.ef-movieinfo-card { font-size: 13px; color: #1f2937; }
		.ef-movieinfo-card .ef-mi-head { display: flex; gap: 12px; align-items: flex-start; }
		.ef-movieinfo-card .ef-mi-poster {
			width: 110px; min-width: 110px; height: auto;
			border-radius: 6px; border: 1px solid #d1d5db;
			background: #f3f4f6;
		}
		.ef-movieinfo-card .ef-mi-main { min-width: 0; }
		.ef-movieinfo-card .ef-mi-meta { color: #374151; line-height: 1.45; }
		.ef-movieinfo-card a { color: #2563eb; text-decoration: none; }
		.ef-movieinfo-card a:hover { text-decoration: underline; }
		/* ── Statusbar colours ────────────────────────────────────────────── */
		.elfinder .elfinder-statusbar .elfinder-path      { color: #1565c0; }
		.elfinder .elfinder-statusbar .elfinder-stat-size { color: #6a0dad; }

		/* ── MediaInfo standalone popup ──────────────────────────────────── */
		.ef-mediainfo-popup pre {
			white-space: pre-wrap;
			word-break: break-word;
			font-size: 0.78em;
			line-height: 1.4;
			margin: 0;
			padding: 8px 10px;
			background: #f8f8f8;
			border: 1px solid #e0e0e0;
			border-radius: 3px;
			max-height: 400px;
			overflow-y: auto;
		}

		/* ── VLC fallback URL panel ──────────────────────────────────────── */
		.ef-vlc-fallback-popup p { margin: 0 0 8px; }
		.ef-vlc-fallback-popup .ef-vlc-url-field {
			width: 100%;
			box-sizing: border-box;
			font-size: 11px;
			font-family: monospace;
			padding: 4px;
		}
		.ef-vlc-fallback-popup .ef-vlc-copy-btn { margin-top: 8px; }

		.ef-videoplayer-popup .ef-videoplayer-host {
			width: 100%;
			min-height: 240px;
			background: #000;
			border-radius: 4px;
		}
		.ef-videoplayer-popup .ef-videoplayer-note {
			margin-top: 8px;
			font-size: 12px;
			line-height: 1.4;
			color: #555;
		}
		.ef-videoplayer-popup .ef-videoplayer-actions { margin-top: 10px; }
		.ef-videoplayer-popup .ef-videoplayer-link {
			display: inline-block;
			padding: 6px 10px;
			border: 1px solid #bbb;
			border-radius: 4px;
			text-decoration: none;
			font-size: 12px;
			color: #1f2937;
			background: #fff;
		}
		.ef-videoplayer-popup .ef-videoplayer-link:hover { background: #f3f4f6; }

		/* ── Mobile: bigger touch targets ─────────────────────────────────── */
		@media (max-width: 600px) {
			#ef-toolbar-toggle { display: block !important; }
			.elfinder .elfinder-toolbar {
				overflow-y: scroll !important;
				overflow-x: hidden !important;
			}
			.elfinder-button { min-width: 36px !important; min-height: 36px !important; }
			.elfinder-toolbar-button-separator { display: none !important; }
		}
		/* ── Mobile toolbar toggle (top drawer style) ─────────────────────── */
		#ef-toolbar-toggle {
			display: none;
			cursor: pointer;
			padding: 2px 8px;
			background: #f0f0f0;
			border-bottom: 1px solid #ccc;
			font-size: 12px;
			user-select: none;
		}
		/* Keep the mobile toolbar reopen handle visible and interactive.
		   elFinder removes it at runtime if pointer-events is none. */
		.elfinder-touch .elfinder-toolbar-swipe-handle {
			pointer-events: auto !important;
			display: block !important;
			z-index: 3;
		}
	</style>
</head>
<body>
	<div id="elfinder-container"></div>

	<!-- ── Skin selector panel ──────────────────────────────────────────── -->
	<div id="ef-skin-panel">
		<label>Theme / Skin</label>
		<select id="ef-skin-select" onchange="efChangeSkin(this.value)">
			<option value="">Default</option>
			<option value="bootstrap">Bootstrap</option>
			<option value="material">Material</option>
			<option value="moono">Moono</option>
			<option value="windows-10">Windows 10</option>
		</select>
		<hr>
		<a href="/cgi-bin/conf/elfinder" target="_blank">⚙ Advanced settings</a>
	</div>

	<script>
	// ---------------------------------------------------------------------------
	// Dialog UX helpers
	// ---------------------------------------------------------------------------
	function efDialogAppendTarget() {
		var $container = $('#elfinder-container');
		return $container.length ? $container : $('body');
	}

	function efViewportSize() {
		var vv = window.visualViewport;
		return {
			width: Math.round(vv && vv.width ? vv.width : (window.innerWidth || $(window).width() || 0)),
			height: Math.round(vv && vv.height ? vv.height : (window.innerHeight || $(window).height() || 0))
		};
	}

	function efFitCustomDialog($content, preferredWidth) {
		if (!$content || !$content.length) return;
		var $dlg = $content.closest('.ui-dialog');
		if (!$dlg.length || !$dlg.is(':visible')) return;

		var vp = efViewportSize();
		var maxDialogW = Math.max(260, vp.width - 16);
		var targetW = Math.min(preferredWidth || maxDialogW, maxDialogW);
		var maxDialogH = Math.max(220, vp.height - 28);
		var chromeH = 96;

		try {
			$content.dialog('option', 'width', targetW);
		} catch (e) {
			$dlg.css('width', targetW + 'px');
		}

		$dlg.css({
			'max-width': maxDialogW + 'px',
			'max-height': maxDialogH + 'px'
		});

		$content.css({
			'max-height': Math.max(120, maxDialogH - chromeH) + 'px',
			'overflow-y': 'auto',
			'overflow-x': 'auto'
		});

		efNormalizeDialogPosition($dlg);
	}

	function efRefitVisibleCustomDialogs() {
		$('.ef-mediainfo-popup:visible, .ef-movieinfo-popup:visible, .ef-vlc-fallback-popup:visible').each(function() {
			var $content = $(this);
			var preferredWidth = parseInt($content.attr('data-ef-dialog-width'), 10);
			efFitCustomDialog($content, isFinite(preferredWidth) ? preferredWidth : 650);
		});
	}

	function efNormalizeDialogPosition($dlg) {
		if (!$dlg || !$dlg.length) return;
		var viewportW = $(window).width();
		var viewportH = $(window).height();
		var top = parseInt($dlg.css('top'), 10);
		var left = parseInt($dlg.css('left'), 10);
		if (!isFinite(top)) top = 24;
		if (!isFinite(left)) left = Math.max(8, (viewportW - $dlg.outerWidth()) / 2);

		if (top > Math.floor(viewportH * 0.45)) {
			top = 24;
		}

		var maxLeft = Math.max(8, viewportW - $dlg.outerWidth() - 8);
		var maxTop = Math.max(8, viewportH - $dlg.outerHeight() - 8);
		left = Math.max(8, Math.min(left, maxLeft));
		top = Math.max(8, Math.min(top, maxTop));

		$dlg.css({ left: left + 'px', top: top + 'px' });
	}

	function efEnableTouchDialogDrag() {
		var drag = null;
		$(document).off('touchstart.efDialogDrag').on('touchstart.efDialogDrag', '.ui-dialog .ui-dialog-titlebar', function(e) {
			var touch = e.originalEvent && e.originalEvent.touches ? e.originalEvent.touches[0] : null;
			if (!touch) return;
			var $dlg = $(this).closest('.ui-dialog');
			if (!$dlg.length) return;
			var left = parseInt($dlg.css('left'), 10);
			var top = parseInt($dlg.css('top'), 10);
			drag = {
				$dlg: $dlg,
				offsetX: touch.clientX - (isFinite(left) ? left : 0),
				offsetY: touch.clientY - (isFinite(top) ? top : 0)
			};
			e.preventDefault();
		});

		$(document).off('touchmove.efDialogDrag').on('touchmove.efDialogDrag', function(e) {
			if (!drag) return;
			var touch = e.originalEvent && e.originalEvent.touches ? e.originalEvent.touches[0] : null;
			if (!touch) return;
			var viewportW = $(window).width();
			var viewportH = $(window).height();
			var dlgW = drag.$dlg.outerWidth();
			var dlgH = drag.$dlg.outerHeight();
			var left = touch.clientX - drag.offsetX;
			var top = touch.clientY - drag.offsetY;
			left = Math.max(8, Math.min(left, Math.max(8, viewportW - dlgW - 8)));
			top = Math.max(8, Math.min(top, Math.max(8, viewportH - dlgH - 8)));
			drag.$dlg.css({ left: left + 'px', top: top + 'px' });
			e.preventDefault();
		});

		$(document).off('touchend.efDialogDrag touchcancel.efDialogDrag').on('touchend.efDialogDrag touchcancel.efDialogDrag', function() {
			drag = null;
		});
	}

	function efApplyViewportContainerSize() {
		var vv = window.visualViewport;
		var viewportW = vv && vv.width ? Math.round(vv.width) : Math.round(window.innerWidth || $(window).width() || 0);
		var viewportH = vv && vv.height ? Math.round(vv.height) : Math.round(window.innerHeight || $(window).height() || 0);
		if (viewportW < 1 || viewportH < 1) return;
		$('#elfinder-container').css({
			width: viewportW + 'px',
			height: viewportH + 'px',
			'max-width': viewportW + 'px',
			'max-height': viewportH + 'px'
		});
	}

	// Keep all dialogs higher and inside viewport when opened.
	$(document).off('dialogopen.efDialogUx').on('dialogopen.efDialogUx', function(e) {
		var $dlg = $(e.target).closest('.ui-dialog');
		efNormalizeDialogPosition($dlg);
	});

	// Make jQuery UI dialogs draggable by touch on mobile.
	efEnableTouchDialogDrag();

	// Keep custom dialogs in-view and width-adaptive during orientation/resize.
	$(window).off('resize.efCustomDialogs orientationchange.efCustomDialogs').on('resize.efCustomDialogs orientationchange.efCustomDialogs', function() {
		setTimeout(efRefitVisibleCustomDialogs, 40);
	});
	if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
		window.visualViewport.addEventListener('resize', function() {
			setTimeout(efRefitVisibleCustomDialogs, 40);
		});
	}

	// ---------------------------------------------------------------------------
	// Detect browser language and map to elFinder i18n file
	// ---------------------------------------------------------------------------
	var langMap = {
		'it': 'elfinder.it',
		'de': 'elfinder.de',
		'fr': 'elfinder.fr',
		'es': 'elfinder.es',
		'pt': 'elfinder.pt_BR',
		'ru': 'elfinder.ru',
		'zh': 'elfinder.zh_CN',
		'ja': 'elfinder.ja',
		'ko': 'elfinder.ko',
		'nl': 'elfinder.nl',
		'pl': 'elfinder.pl',
		'cs': 'elfinder.cs',
		'hu': 'elfinder.hu',
		'ro': 'elfinder.ro',
		'sv': 'elfinder.sv',
		'tr': 'elfinder.tr',
	};
	var browserLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0].toLowerCase();
	var i18nFile = langMap[browserLang] || null;

	// ── Theme/skin ────────────────────────────────────────────────────────────
	function efApplyTheme(name) {
		// Sanitize: only alphanumeric, hyphens, underscores
		if (!name || !/^[a-zA-Z0-9_-]+$/.test(name)) {
			document.getElementById('elfinder-theme-css').href = '';
			return;
		}
		document.getElementById('elfinder-theme-css').href =
			'css/themes/' + name + '/css/theme.css';
	}

	function efChangeSkin(name) {
		efApplyTheme(name);
		try { localStorage.setItem('elfinder_theme', name); } catch(e) {}
		document.getElementById('ef-skin-panel').style.display = 'none';
	}

	// Opens/closes the skin panel, positioning it below the toolbar button.
	function efToggleSkinPanel(btn) {
		var p = document.getElementById('ef-skin-panel');
		if (p.style.display === 'block') {
			p.style.display = 'none';
			return;
		}
		if (btn) {
			var rect = btn.getBoundingClientRect();
			p.style.top  = (rect.bottom + 4) + 'px';
			// Keep panel on-screen: if would overflow right, align to right edge
			var panelW = 190;
			var left   = rect.left;
			if (left + panelW > window.innerWidth) left = window.innerWidth - panelW - 6;
			p.style.left  = Math.max(4, left) + 'px';
			p.style.right = 'auto';
		}
		p.style.display = 'block';
	}

	// Close skin panel when clicking outside it or the skin button
	document.addEventListener('click', function(e) {
		var panel = document.getElementById('ef-skin-panel');
		var btn   = document.getElementById('ef-skin-btn');
		if (panel && panel.style.display === 'block' &&
				!panel.contains(e.target) &&
				!(btn && btn.contains(e.target))) {
			panel.style.display = 'none';
		}
	});

	// ---------------------------------------------------------------------------
	// MediaInfo popup – opens a jQuery UI dialog with the output of the
	// mediainfo binary for the currently selected file.  Works for any
	// file type; the PHP plugin no longer limits processing to audio/video.
	// ---------------------------------------------------------------------------
	function efShowMediaInfo(fm) {
		var selected = fm.selectedFiles();
		if (!selected || !selected.length) {
			return;
		}
		var file = selected[0];
		var $content = $('<div class="ef-mediainfo-popup"><span class="elfinder-spinner"></span></div>');
		$content.dialog({
			title: 'MediaInfo \u2013 ' + fm.escape(file.name),
			modal: false,
			appendTo: efDialogAppendTarget(),
			width: Math.min(650, Math.max(260, efViewportSize().width - 16)),
			open: function() {
				$content.attr('data-ef-dialog-width', '650');
				efFitCustomDialog($content, 650);
			},
			close: function() { $(this).dialog('destroy').remove(); }
		});
		fm.request({
			data: { cmd: 'info', targets: [file.hash], with_mediainfo: 1 },
			preventDefault: true
		}).done(function(data) {
			var f = data.files && data.files.length ? data.files[0] : null;
			$content.html(f && f.mediainfo
				? '<pre>' + fm.escape(f.mediainfo) + '</pre>'
				: '<p style="color:#888;font-style:italic;padding:8px">No MediaInfo data available.</p>');
			try { if (f) fm.cache(data.files); } catch(e) {}
			efFitCustomDialog($content, 650);
		}).fail(function() {
			$content.html('<p style="color:#c00;padding:8px">MediaInfo request failed.</p>');
			efFitCustomDialog($content, 650);
		});
	}

	// ---------------------------------------------------------------------------
	// MovieInfo popup – uses filename inference + online metadata lookup
	// provided by the MovieInfo PHP plugin (TMDb / OMDb / Wikipedia / IMDb).
	// ---------------------------------------------------------------------------
	function efMovieInfoLog(level, msg, data) {
		var prefix = '[MovieInfo] ';
		try {
			if (level === 'error') {
				if (typeof data !== 'undefined') {
					console.error(prefix + msg, data);
				} else {
					console.error(prefix + msg);
				}
			} else {
				if (typeof data !== 'undefined') {
					console.debug(prefix + msg, data);
				} else {
					console.debug(prefix + msg);
				}
			}
		} catch (e) {}
	}

	function efAjaxEndpoints(action) {
		// Probe several known CGI paths: different firmware layouts expose
		// different endpoint aliases (conf, .cgi, bare name).
		var qs = '?ajax=1&action=' + encodeURIComponent(action);
		var bases = [];
		var persistedBase = '';
		try { persistedBase = localStorage.getItem('ef_ajax_base') || ''; } catch (e) {}
		if (persistedBase) {
			bases.push(persistedBase);
		}
		if (window.__efAjaxBase) {
			bases.push(window.__efAjaxBase);
		}
		bases.push('/cgi-bin/conf/elfinder');
		bases.push('/cgi-bin/conf/elfinder.cgi');
		var out = [];
		for (var i = 0; i < bases.length; i++) {
			if (out.indexOf(bases[i]) === -1) {
				out.push(bases[i]);
			}
		}
		for (var j = 0; j < out.length; j++) {
			out[j] += qs;
		}
		return out;
	}

	function efParseWrappedAjaxJson(text) {
		if (!text) {
			throw new Error('Invalid response format');
		}
		var trimmed = String(text).trim();
		if (trimmed.indexOf('{') === 0) {
			return JSON.parse(trimmed);
		}
		if (trimmed.indexOf('id_go') !== -1) {
			throw new Error('Authentication required');
		}
		// Some targets wrap JSON in HTML (<pre>...</pre>), others return
		// plain text with a Content-Type marker. Accept both formats.
		var marker = 'Content-Type: application/json';
		var markerPos = trimmed.indexOf(marker);
		if (markerPos !== -1) {
			var marked = trimmed.substring(markerPos + marker.length);
			var firstMarked = marked.indexOf('{');
			if (firstMarked !== -1) {
				var payloadMarked = marked.substring(firstMarked);
				var depthMarked = 0;
				for (var j = 0; j < payloadMarked.length; j++) {
					if (payloadMarked[j] === '{') depthMarked++;
					else if (payloadMarked[j] === '}') {
						depthMarked--;
						if (depthMarked === 0) {
							return JSON.parse(payloadMarked.substring(0, j + 1));
						}
					}
				}
			}
		}

		var m = trimmed.match(/<pre[^>]*>\s*Content-Type:\s*application\/json\s*([\s\S]*?)<\/pre>/i);
		if (!m || !m[1]) throw new Error('Invalid response format');
		var payload = String(m[1]).trim();
		var first = payload.indexOf('{');
		if (first === -1) throw new Error('No JSON payload');
		var depth = 0, end = -1;
		for (var i = first; i < payload.length; i++) {
			if (payload[i] === '{') depth++;
			else if (payload[i] === '}') {
				depth--;
				if (depth === 0) { end = i + 1; break; }
			}
		}
		if (end === -1) throw new Error('Incomplete JSON payload');
		return JSON.parse(payload.substring(first, end));
	}

	function efCallAjaxAction(action, params) {
		params = params || {};
		var endpoints = efAjaxEndpoints(action);
		var idx = 0;

		var buildTail = function() {
			var tail = '';
			for (var k in params) {
				if (!Object.prototype.hasOwnProperty.call(params, k)) continue;
				tail += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(String(params[k]));
			}
			return tail;
		};

		var tail = buildTail();

		return new Promise(function(resolve, reject) {
			var attempt = function(lastErr) {
				if (idx >= endpoints.length) {
					reject(lastErr || new Error('No working AJAX endpoint found'));
					return;
				}

				var url = endpoints[idx++] + tail;
				efMovieInfoLog('debug', 'Trying AJAX endpoint', { action: action, url: url });

				fetch(url)
					.then(function(r) {
						return r.text().then(function(text) {
							return {
								url: url,
								status: r.status,
								ok: r.ok,
								text: text
							};
						});
					})
					.then(function(resp) {
						efMovieInfoLog('debug', 'AJAX raw response received', {
							action: action,
							url: resp.url,
							status: resp.status,
							ok: resp.ok,
							responseLength: resp.text ? resp.text.length : 0,
							head: resp.text ? resp.text.substring(0, 120) : ''
						});
						if (!resp.ok) {
							throw new Error('HTTP ' + resp.status);
						}
						var data = efParseWrappedAjaxJson(resp.text);
						if (data && typeof data.error === 'string' && /unknown action/i.test(data.error)) {
							efMovieInfoLog('debug', 'Endpoint returned Unknown action, trying next endpoint', {
								action: action,
								url: resp.url
							});
							throw new Error('Unknown action');
						}
						window.__efAjaxBase = resp.url.split('?')[0];
						try { localStorage.setItem('ef_ajax_base', window.__efAjaxBase); } catch (e) {}
						resolve({ data: data, url: resp.url, status: resp.status });
					})
					.catch(function(err) {
						var willRetry = idx < endpoints.length;
						efMovieInfoLog(willRetry ? 'debug' : 'error', 'AJAX endpoint attempt failed', {
							action: action,
							url: url,
							willRetry: willRetry,
							error: err && err.message ? err.message : err
						});
						attempt(err);
					});
			};

			attempt();
		});
	}

	function efBindMovieInfoTmdbPanel($content, fm, file, reloadFn) {
		var $panel = $content.find('.ef-mi-tmdb-panel');
		if (!$panel.length) return;

		var $tmdbKey = $panel.find('.ef-mi-key-tmdb, .ef-mi-tmdb-key').first();
		var $omdbKey = $panel.find('.ef-mi-key-omdb').first();
		var $providerBtns = $panel.find('.ef-mi-provider-btn');
		var $editKeysBtn = $panel.find('.ef-mi-edit-keys').first();
		var $keyFields = $panel.find('.ef-mi-key-fields').first();
		var $save = $panel.find('.ef-mi-keys-save, .ef-mi-tmdb-save').first();
		var $btn = $panel.find('.ef-mi-keys-apply, .ef-mi-tmdb-apply').first();
		var $status = $panel.find('.ef-mi-keys-status, .ef-mi-tmdb-status').first();
		var hasTmdbConfigured = $panel.attr('data-ef-mi-has-tmdb-key') === '1';
		var hasOmdbConfigured = $panel.attr('data-ef-mi-has-omdb-key') === '1';
		var keysCollapsed = $panel.attr('data-ef-mi-keys-collapsed') === '1';
		var selectedProvider = String($panel.attr('data-ef-mi-selected-provider') || 'auto').toLowerCase();
		if (!/^(auto|tmdb|omdb|wikipedia|imdb)$/.test(selectedProvider)) selectedProvider = 'auto';

		var setStatus = function(message, kind) {
			if (!$status.length) return;
			var css = {
				'margin-top': '6px',
				'font-size': '12px',
				'padding': '6px 8px',
				'border-radius': '4px',
				'border': '1px solid transparent'
			};
			if (kind === 'success') {
				css.color = '#166534';
				css.background = '#ecfdf3';
				css['border-color'] = '#86efac';
			} else if (kind === 'error') {
				css.color = '#b91c1c';
				css.background = '#fef2f2';
				css['border-color'] = '#fca5a5';
			} else {
				css.color = '#374151';
				css.background = '#f3f4f6';
				css['border-color'] = '#d1d5db';
			}
			$status.css(css).text(message);
		};

		var setKeysUi = function(collapsed) {
			keysCollapsed = !!collapsed;
			if ($keyFields.length) {
				$keyFields.css('display', keysCollapsed ? 'none' : 'block');
			}
			if ($editKeysBtn.length) {
				$editKeysBtn.text(keysCollapsed ? 'Edit keys' : 'Hide keys');
			}
		};

		var setProviderUi = function(provider) {
			selectedProvider = provider;
			$providerBtns.removeClass('ef-mi-provider-btn-active').css({
				'font-weight': 'normal',
				'border-color': '#d1d5db',
				'background': '#fff'
			});
			$providerBtns.filter('[data-ef-mi-provider="' + provider + '"]').addClass('ef-mi-provider-btn-active').css({
				'font-weight': '600',
				'border-color': '#2563eb',
				'background': '#eff6ff'
			});
			setStatus('Selected provider: ' + provider.toUpperCase(), 'info');
		};

		$providerBtns.off('click').on('click', function() {
			var p = String($(this).attr('data-ef-mi-provider') || '').toLowerCase();
			if (/^(auto|tmdb|omdb|wikipedia|imdb)$/.test(p)) {
				setProviderUi(p);
			}
		});
		setProviderUi(selectedProvider);
		setKeysUi(keysCollapsed);

		$editKeysBtn.off('click').on('click', function() {
			setKeysUi(!keysCollapsed);
		});

		var efLegacySaveMovieInfoKeys = function(tmdbKey, omdbKey) {
			var calls = [];
			if (tmdbKey) {
				calls.push(function() {
					return efCallAjaxAction('set_movieinfo_tmdb_key', {
						tmdb_api_key: tmdbKey,
						save_config: '1'
					});
				});
			}
			if (omdbKey) {
				calls.push(function() {
					return efCallAjaxAction('set_movieinfo_omdb_key', {
						omdb_api_key: omdbKey,
						save_config: '1'
					});
				});
			}

			if (!calls.length) {
				return Promise.reject(new Error('No API key provided'));
			}

			return calls.reduce(function(p, fn) {
				return p.then(fn);
			}, Promise.resolve());
		};

		var efSaveMovieInfoKeysViaConnector = function(tmdbKey, omdbKey, saveCfg) {
			var connectorBase = (fm && fm.options && fm.options.url) ? fm.options.url : 'php/connector.php';
			var sep = connectorBase.indexOf('?') === -1 ? '?' : '&';
			var url = connectorBase + sep + 'cmd=movieinfo_setkeys'
				+ '&save_config=' + encodeURIComponent(saveCfg ? '1' : '0');
			if (tmdbKey) {
				url += '&tmdb_api_key=' + encodeURIComponent(tmdbKey);
			}
			if (omdbKey) {
				url += '&omdb_api_key=' + encodeURIComponent(omdbKey);
			}

			return fetch(url, { credentials: 'same-origin' })
				.then(function(r) {
					if (!r.ok) {
						throw new Error('HTTP ' + r.status);
					}
					return r.text();
				})
				.then(function(text) {
					var trimmed = String(text || '').trim();
					if (trimmed.indexOf('id_go') !== -1) {
						throw new Error('Authentication required');
					}
					if (!trimmed || trimmed.indexOf('{') !== 0) {
						throw new Error('Invalid connector response format');
					}
					var data = JSON.parse(trimmed);
					if (!data || data.success !== true) {
						throw new Error((data && data.error) ? data.error : 'Unable to save key(s)');
					}
					return data;
				});
		};

		try {
			var cachedTmdb = localStorage.getItem('ef_movieinfo_tmdb_api_key') || '';
			var cachedOmdb = localStorage.getItem('ef_movieinfo_omdb_api_key') || '';
			if (!hasTmdbConfigured && cachedTmdb && $tmdbKey.length) $tmdbKey.val(cachedTmdb);
			if (!hasOmdbConfigured && cachedOmdb && $omdbKey.length) $omdbKey.val(cachedOmdb);
		} catch (e) {}
		if (hasTmdbConfigured && $tmdbKey.length && !$tmdbKey.val()) {
			$tmdbKey.attr('placeholder', 'Configured on device');
		}
		if (hasOmdbConfigured && $omdbKey.length && !$omdbKey.val()) {
			$omdbKey.attr('placeholder', 'Configured on device');
		}

		$btn.off('click').on('click', function() {
			var tmdbKey = String($tmdbKey.val() || '').trim();
			var omdbKey = String($omdbKey.val() || '').trim();
			var saveCfg = !!$save.prop('checked');
			var hasTmdbAvailable = !!tmdbKey || hasTmdbConfigured;
			var hasOmdbAvailable = !!omdbKey || hasOmdbConfigured;
			efMovieInfoLog('debug', 'MovieInfo keys apply clicked', {
				file: file && file.name ? file.name : '',
				saveConfig: saveCfg,
				tmdbKeyLength: tmdbKey.length,
				omdbKeyLength: omdbKey.length,
				selectedProvider: selectedProvider,
				hasTmdbConfigured: hasTmdbConfigured,
				hasOmdbConfigured: hasOmdbConfigured
			});

			if (selectedProvider === 'tmdb' && !hasTmdbAvailable) {
				setStatus('Please enter a TMDb API key.', 'error');
				efMovieInfoLog('error', 'TMDb key is empty');
				return;
			}
			if (tmdbKey && !/^[A-Za-z0-9]{16,128}$/.test(tmdbKey)) {
				setStatus('Invalid TMDb key format.', 'error');
				efMovieInfoLog('error', 'TMDb key format validation failed', { keyLength: tmdbKey.length });
				return;
			}
			if (selectedProvider === 'omdb' && !hasOmdbAvailable) {
				setStatus('Please enter an OMDb API key.', 'error');
				efMovieInfoLog('error', 'OMDb key is empty');
				return;
			}
			if (omdbKey && !/^[A-Za-z0-9]{6,128}$/.test(omdbKey)) {
				setStatus('Invalid OMDb key format.', 'error');
				efMovieInfoLog('error', 'OMDb key format validation failed', { keyLength: omdbKey.length });
				return;
			}

			if (!saveCfg) {
				try {
					if (tmdbKey) localStorage.setItem('ef_movieinfo_tmdb_api_key', tmdbKey);
					if (omdbKey) localStorage.setItem('ef_movieinfo_omdb_api_key', omdbKey);
				} catch (e) {}
				setStatus('Applied for current session. Running lookup...', 'success');
				efMovieInfoLog('debug', 'Applying MovieInfo keys without config save (session override only)', {
					provider: selectedProvider,
					hasTmdb: !!tmdbKey,
					hasOmdb: !!omdbKey
				});
				setTimeout(function() {
					reloadFn(saveCfg ? '' : tmdbKey, saveCfg ? '' : omdbKey, selectedProvider);
				}, 450);
				return;
			}

			setStatus(saveCfg ? 'Saving key(s)...' : 'Applying key(s)...', 'info');

			var req = {
				save_config: saveCfg ? '1' : '0'
			};
			if (tmdbKey) req.tmdb_api_key = tmdbKey;
			if (omdbKey) req.omdb_api_key = omdbKey;

			efSaveMovieInfoKeysViaConnector(tmdbKey, omdbKey, saveCfg)
				.then(function(resp) {
					var data = resp || {};
					efMovieInfoLog('debug', 'MovieInfo keys saved via connector', {
						payload: data
					});
					if (!data || data.success !== true) {
						throw new Error((data && data.error) ? data.error : 'Unable to apply key(s)');
					}
					try {
						if (tmdbKey) localStorage.setItem('ef_movieinfo_tmdb_api_key', tmdbKey);
						if (omdbKey) localStorage.setItem('ef_movieinfo_omdb_api_key', omdbKey);
					} catch (e) {}
					setStatus(data.message || 'MovieInfo key(s) applied. Retrying lookup...', 'success');
					setKeysUi(true);
					efMovieInfoLog('debug', 'MovieInfo keys applied successfully via connector, retrying lookup', {
						saved: !!data.saved,
						saveRequested: saveCfg,
						provider: selectedProvider,
						hasTmdb: !!tmdbKey,
						hasOmdb: !!omdbKey
					});
					setTimeout(function() {
						reloadFn(saveCfg ? '' : tmdbKey, saveCfg ? '' : omdbKey, selectedProvider);
					}, 450);
				})
				.catch(function(err) {
					var msg = err && err.message ? err.message : 'Unable to apply key(s)';
					if (!saveCfg) {
						setStatus('Error: ' + msg, 'error');
						efMovieInfoLog('error', 'MovieInfo keys set action failed on all endpoints', msg);
						return;
					}

					efMovieInfoLog('debug', 'Connector save failed, trying legacy AJAX flow', {
						error: msg,
						hasTmdb: !!tmdbKey,
						hasOmdb: !!omdbKey
					});

					efCallAjaxAction('set_movieinfo_keys', req)
						.then(function(resp2) {
							var data2 = resp2.data || {};
							if (!data2 || data2.success !== true) {
								throw new Error((data2 && data2.error) ? data2.error : 'Unable to apply key(s)');
							}
							try {
								if (tmdbKey) localStorage.setItem('ef_movieinfo_tmdb_api_key', tmdbKey);
								if (omdbKey) localStorage.setItem('ef_movieinfo_omdb_api_key', omdbKey);
							} catch (e) {}
							setStatus(data2.message || 'MovieInfo key(s) applied. Retrying lookup...', 'success');
							setKeysUi(true);
							setTimeout(function() {
								reloadFn(saveCfg ? '' : tmdbKey, saveCfg ? '' : omdbKey, selectedProvider);
							}, 450);
						})
						.catch(function() {

							efMovieInfoLog('debug', 'Combined key-save action failed, trying legacy per-key actions', {
								error: msg,
								hasTmdb: !!tmdbKey,
								hasOmdb: !!omdbKey
							});
							setStatus('Combined save unsupported, trying legacy save...', 'info');

							efLegacySaveMovieInfoKeys(tmdbKey, omdbKey)
								.then(function() {
									try {
										if (tmdbKey) localStorage.setItem('ef_movieinfo_tmdb_api_key', tmdbKey);
										if (omdbKey) localStorage.setItem('ef_movieinfo_omdb_api_key', omdbKey);
									} catch (e) {}
									setStatus('MovieInfo key(s) saved via legacy API. Retrying lookup...', 'success');
									setKeysUi(true);
									efMovieInfoLog('debug', 'Legacy MovieInfo key save completed, retrying lookup', {
										provider: selectedProvider,
										hasTmdb: !!tmdbKey,
										hasOmdb: !!omdbKey
									});
									setTimeout(function() {
										reloadFn(saveCfg ? '' : tmdbKey, saveCfg ? '' : omdbKey, selectedProvider);
									}, 450);
								})
								.catch(function(legacyErr) {
									var legacyMsg = legacyErr && legacyErr.message ? legacyErr.message : msg;
									setStatus('Error: ' + legacyMsg, 'error');
									efMovieInfoLog('error', 'Legacy MovieInfo key save failed', legacyMsg);
								});
						});
				});
		});
	}

	function efShowMovieInfo(fm) {
		var selected = fm.selectedFiles();
		if (!selected || !selected.length) {
			return;
		}
		var file = selected[0];
		var $content = $('<div class="ef-movieinfo-popup"><span class="elfinder-spinner"></span></div>');
		var fitMovieInfoDialog = function() {
			var $dlg = $content.closest('.ui-dialog');
			if (!$dlg.length) return;
			var vp = efViewportSize();
			var maxDialogW = Math.max(280, vp.width - 16);
			var targetDialogW = Math.min(780, maxDialogW);
			var maxDialogH = Math.max(260, vp.height - 28);
			var chromeH = 96; // titlebar + paddings + margins
			try {
				$content.dialog('option', 'width', targetDialogW);
			} catch (e) {
				$dlg.css('width', targetDialogW + 'px');
			}
			$dlg.css('max-width', maxDialogW + 'px');
			$dlg.css('max-height', maxDialogH + 'px');
			$content.css({
				'max-height': Math.max(120, maxDialogH - chromeH) + 'px',
				'overflow-y': 'auto',
				'overflow-x': 'auto'
			});
			efNormalizeDialogPosition($dlg);
		};
		$content.dialog({
			title: 'Movie Info \u2013 ' + fm.escape(file.name),
			modal: false,
			appendTo: efDialogAppendTarget(),
			width: Math.min(780, Math.max(280, efViewportSize().width - 16)),
			open: function() {
				$content.attr('data-ef-dialog-width', '780');
				fitMovieInfoDialog();
			},
			close: function() { $(this).dialog('destroy').remove(); }
		});

		var loadMovieInfo = function(tmdbKeyOverride, omdbKeyOverride, providerOverride) {
			efMovieInfoLog('debug', 'Loading movie info', {
				file: file && file.name ? file.name : '',
				hasTmdbOverride: !!tmdbKeyOverride,
				hasOmdbOverride: !!omdbKeyOverride,
				providerOverride: providerOverride || ''
			});
			$content.html('<span class="elfinder-spinner"></span>');
			var reqData = { cmd: 'info', targets: [file.hash] };
			if (tmdbKeyOverride) {
				reqData.movieinfo_tmdb_api_key = tmdbKeyOverride;
			}
			if (omdbKeyOverride) {
				reqData.movieinfo_omdb_api_key = omdbKeyOverride;
			}
			if (tmdbKeyOverride || omdbKeyOverride) {
				reqData.movieinfo_use_request_keys = 1;
			}
			if (providerOverride && /^(auto|tmdb|omdb|wikipedia|imdb)$/.test(String(providerOverride).toLowerCase())) {
				reqData.movieinfo_provider = String(providerOverride).toLowerCase();
			}
			fm.request({
				data: reqData,
				preventDefault: true
			}).done(function(data) {
				efMovieInfoLog('debug', 'Movie info request completed', data);
				var f = data.files && data.files.length ? data.files[0] : null;
				if (f && f.movieinfo_html) {
					$content.html(f.movieinfo_html);
						fitMovieInfoDialog();
					efBindMovieInfoTmdbPanel($content, fm, file, loadMovieInfo);
					var $notFoundCard = $content.find('.ef-movieinfo-card[data-ef-mi-status="not-found"]').first();
					if ($notFoundCard.length) {
						var dbg = {
							provider: $notFoundCard.attr('data-ef-mi-provider') || '',
							attemptedProviders: $notFoundCard.attr('data-ef-mi-attempted') || '',
							guessTitle: $notFoundCard.attr('data-ef-mi-guess-title') || '',
							guessYear: $notFoundCard.attr('data-ef-mi-guess-year') || '',
							reason: $notFoundCard.attr('data-ef-mi-debug-reason') || '',
							debugDetail: $notFoundCard.attr('data-ef-mi-debug-detail') || '',
							hasTmdbKey: $notFoundCard.attr('data-ef-mi-has-tmdb-key') === '1',
							hasOmdbKey: $notFoundCard.attr('data-ef-mi-has-omdb-key') === '1',
							file: file && file.name ? file.name : ''
						};
						efMovieInfoLog('error', 'No match found in configured providers', dbg);
						if (dbg.provider === 'imdb' || dbg.reason === 'imdb_no_hit' || dbg.reason === 'auto_fallback_to_imdb_no_hit') {
							efMovieInfoLog('error', 'IMDb lookup returned no suitable candidate for parsed filename', {
								guessTitle: dbg.guessTitle,
								guessYear: dbg.guessYear,
								provider: dbg.provider,
								attemptedProviders: dbg.attemptedProviders,
								reason: dbg.reason
							});
						}
					}
					efMovieInfoLog('debug', 'Movie info HTML rendered', {
						hasTmdbPanel: $content.find('.ef-mi-tmdb-panel').length > 0,
						hasProviderButtons: $content.find('.ef-mi-provider-btn').length > 0
					});
				} else {
					$content.html('<p style="color:#888;font-style:italic;padding:8px">No movie information available for this file.</p>');
						fitMovieInfoDialog();
					efMovieInfoLog('error', 'No movie information available in response payload');
				}
				try { if (f) fm.cache(data.files); } catch(e) {}
			}).fail(function() {
				$content.html('<p style="color:#c00;padding:8px">MovieInfo request failed.</p>');
					fitMovieInfoDialog();
				efMovieInfoLog('error', 'Movie info request failed (fm.request fail callback)');
			});
		};

			$(window).off('resize.efMovieInfo orientationchange.efMovieInfo').on('resize.efMovieInfo orientationchange.efMovieInfo', function() {
				setTimeout(fitMovieInfoDialog, 40);
			});

		// First load always uses persisted backend config (file) as source of truth.
		loadMovieInfo('', '', '');
	}

	// ---------------------------------------------------------------------------
	// VLC open – constructs the absolute connector URL for the selected file
	// and navigates to the vlc:// protocol handler so the OS opens it in VLC.
	// ---------------------------------------------------------------------------
	function efOpenInVlc(fm) {
		var selected = fm.selectedFiles();
		if (!selected || !selected.length) {
			return;
		}
		var file = selected[0];
		var rel  = fm.options.url
			+ '?cmd=file&target=' + encodeURIComponent(file.hash)
			+ '&_t=' + (file.ts || parseInt(+new Date() / 1000));
		var abs  = new URL(rel, window.location.href).href;
		var a = document.createElement('a');
		a.href = 'vlc:' + abs;
		a.style.display = 'none';
		document.body.appendChild(a);
		a.click();
		setTimeout(function() { document.body.removeChild(a); }, 200);
		/* Fallback: if window hasn't lost focus within 1 s the protocol    */
		/* handler is not registered – show a copy-URL panel instead.       */
		var launched = false;
		var blurHandler = function() { launched = true; };
		window.addEventListener('blur', blurHandler, { once: true });
		setTimeout(function() {
			window.removeEventListener('blur', blurHandler);
			if (!launched) {
				efShowVlcFallback(abs);
			}
		}, 1000);
	}

	function efShowVlcFallback(url) {
		var safeUrl = $('<span>').text(url).html();
		var $dlg = $('<div class="ef-vlc-fallback-popup">')
			.attr('title', 'Open in VLC – copy URL')
			.html(
				'<p>VLC is not registered as a protocol handler.<br>' +
				'Copy the URL below and paste it in VLC via <em>Media \u2192 Open Network Stream</em>.</p>' +
				'<input type="text" class="ef-vlc-url-field" value="' + safeUrl + '" readonly>' +
				'<button class="ef-vlc-copy-btn">Copy URL</button>'
			);
		$dlg.dialog({
			modal: true,
			appendTo: efDialogAppendTarget(),
			width: Math.min(500, Math.max(260, efViewportSize().width - 16)),
			open: function() {
				$dlg.attr('data-ef-dialog-width', '500');
				efFitCustomDialog($dlg, 500);
				$dlg.find('.ef-vlc-url-field').trigger('select');
				$dlg.find('.ef-vlc-copy-btn').on('click', function() {
					var $btn  = $(this);
					var $field = $dlg.find('.ef-vlc-url-field');
					function done() {
						$btn.text('Copied!');
						setTimeout(function() { $dlg.dialog('close'); }, 800);
					}
					function fallback() {
						var el = $field[0];
						el.focus();
						el.setSelectionRange(0, el.value.length);
						try { document.execCommand('copy'); done(); }
						catch(e) { $btn.text('Select the URL above and press Ctrl+C'); }
					}
					if (navigator.clipboard && navigator.clipboard.writeText) {
						navigator.clipboard.writeText(url).then(done).catch(fallback);
					} else {
						fallback();
					}
				});
			},
			close: function() { $(this).dialog('destroy').remove(); },
			
		});
	}

	function efIsLikelyVideo(file) {
		if (!file) return false;
		if (file.mime && String(file.mime).indexOf('video/') === 0) {
			return true;
		}
		return /\.(mp4|m4v|webm|mkv|mov|avi|mpeg|mpg|ts|m2ts|wmv|flv|ogv)$/i.test(file.name || '');
	}

	function efGetVideoExt(file) {
		var n = (file && file.name ? String(file.name).toLowerCase() : '');
		var m = n.match(/\.([a-z0-9]+)$/i);
		return m ? m[1] : '';
	}

	function efGuessVideoMime(file) {
		if (file && file.mime && String(file.mime).indexOf('video/') === 0) {
			return String(file.mime).toLowerCase();
		}
		var ext = efGetVideoExt(file);
		if (ext === 'mp4' || ext === 'm4v') return 'video/mp4';
		if (ext === 'webm') return 'video/webm';
		if (ext === 'mkv') return 'video/x-matroska';
		if (ext === 'mov') return 'video/quicktime';
		if (ext === 'avi') return 'video/x-msvideo';
		if (ext === 'ts' || ext === 'm2ts') return 'video/mp2t';
		if (ext === 'mpeg' || ext === 'mpg') return 'video/mpeg';
		if (ext === 'wmv') return 'video/x-ms-wmv';
		if (ext === 'flv') return 'video/x-flv';
		if (ext === 'ogv') return 'video/ogg';
		return '';
	}

	function efBuildConnectorFileUrl(fm, file) {
		var rel = fm.options.url
			+ '?cmd=file&target=' + encodeURIComponent(file.hash)
			+ '&_t=' + (file.ts || parseInt(+new Date() / 1000, 10));
		return new URL(rel, window.location.href).href;
	}

	function efBuildPreviewFileUrl(fm, file) {
		var previewBytes = 64 * 1024 * 1024;
		var rel = fm.options.url
			+ '?cmd=file&target=' + encodeURIComponent(file.hash)
			+ '&preview=1'
			+ '&preview_bytes=' + previewBytes
			+ '&_t=' + (file.ts || parseInt(+new Date() / 1000, 10));
		return new URL(rel, window.location.href).href;
	}

	function efOpenInVideoPlayer(fm) {
		var selected = fm.selectedFiles();
		if (!selected || !selected.length) {
			return;
		}

		var file = selected[0];
		if (!efIsLikelyVideo(file)) {
			$('<div>This action is available only for video files.</div>').dialog({
				title: 'Video Player',
				modal: true,
				appendTo: efDialogAppendTarget(),
				width: Math.min(420, Math.max(260, efViewportSize().width - 16)),
				close: function() { $(this).dialog('destroy').remove(); }
			});
			return;
		}

		var sourceUrl = efBuildConnectorFileUrl(fm, file);
		var fullStreamUrl = efBuildConnectorFileUrl(fm, file);
		var mime = efGuessVideoMime(file);
		var safeName = fm.escape(file.name || 'Video');
		var safeUrl = $('<span>').text(sourceUrl).html();
		var safeFullUrl = $('<span>').text(fullStreamUrl).html();
		var sourcePrimary = '<source src="' + safeUrl + '"' + (mime ? ' type="' + $('<span>').text(mime).html() + '"' : '') + '>';
		var sourceFallback = '<source src="' + safeUrl + '">';

		var $dlg = $('<div class="ef-videoplayer-popup">').html(
			'<div class="ef-videoplayer-host">' +
				'<video controls preload="metadata" playsinline style="width:100%;max-height:calc(100vh - 260px);background:#000;border-radius:4px;">' +
					sourcePrimary + sourceFallback +
				'</video>' +
			'</div>' +
			'<div class="ef-videoplayer-note"><strong>' + safeName + '</strong><br>HTTP Range is enabled again. Seek should work when the browser supports the container and codec.</div>' +
			'<div class="ef-videoplayer-actions">' +
				'<a class="ef-videoplayer-link" target="_blank" rel="noopener" href="' + safeUrl + '">Open playback</a> ' +
				'<a class="ef-videoplayer-link" target="_blank" rel="noopener" href="' + safeFullUrl + '">Open full stream</a>' +
			'</div>'
		);

		$dlg.dialog({
			title: 'Video Player - ' + safeName,
			modal: false,
			appendTo: efDialogAppendTarget(),
			width: Math.min(960, Math.max(340, efViewportSize().width - 16)),
			open: function() {
				$dlg.attr('data-ef-dialog-width', '960');
				efFitCustomDialog($dlg, 960);
				var vp = efViewportSize();
				var dlgW = $dlg.outerWidth(true) || Math.min(960, vp.width - 16);
				var idealH = Math.round(dlgW * 9 / 16);
				var maxH = Math.max(240, vp.height - 300);
				$dlg.find('.ef-videoplayer-host').css('height', Math.min(idealH, maxH) + 'px');
			},
			close: function() { $(this).dialog('destroy').remove(); }
		});
	}

	// ---------------------------------------------------------------------------
	// Initialise elFinder
	// ---------------------------------------------------------------------------
	function initElFinder() {
		var $container = $('#elfinder-container');
		efApplyViewportContainerSize();
		if ($container.hasClass('ui-draggable') && typeof $container.draggable === 'function') {
			try { $container.draggable('destroy'); } catch (e) {}
		}
		$container.removeClass('ui-draggable ui-draggable-handle');

		var isMobile = window.matchMedia && window.matchMedia('(max-width: 600px)').matches;

		$('#elfinder-container').elfinder({
			url : 'php/connector.php',
			lang: browserLang in langMap ? browserLang : 'en',
			height: '100%',
			// Ensure jQuery UI dialogs use a high z-index so they are
			// never hidden behind other page elements.
			zIndex: 100,
			// Show toolbar with common commands
			toolbar: [
				['back', 'forward'],
				['reload'],
				['home', 'up'],
				['mkdir', 'mkfile', 'upload'],
				['open', 'download', 'getfile'],
				['info', 'quicklook'],
				['copy', 'cut', 'paste', 'rm', 'duplicate', 'rename', 'edit', 'resize'],
				['extract', 'archive'],
				['search'],
				['view'],
				['help']
			],
			commands: [
				'open', 'reload', 'home', 'up', 'back', 'forward', 'getfile',
				'quicklook', 'download', 'rm', 'duplicate', 'rename', 'mkdir',
				'mkfile', 'upload', 'copy', 'cut', 'paste', 'edit', 'extract',
				'archive', 'search', 'info', 'view', 'resize', 'sort', 'netmount',
				'help', 'fullscreen'
			],
			contextmenu: {
				navbar: ['open', 'copy', 'cut', 'paste', 'duplicate', '|', 'rm', '|', 'rename', '|', 'info'],
				cwd:    ['reload', 'back', '|', 'mkdir', 'mkfile', 'upload', '|', 'paste', '|', 'sort', '|', 'info'],
				files:  ['getfile', '|', 'open', 'quicklook', '|', 'download', '|', 'copy', 'cut', 'paste', 'duplicate', '|', 'rm', '|', 'edit', 'rename', 'resize', '|', 'archive', 'extract', '|', 'info']
			},
			// ── Info command: add MediaInfo section for audio/video ────────
			// When the user clicks the "i" (info) toolbar button or the
			// "Information" context-menu entry for an audio/video file, the
			// PHP MediaInfo plugin adds a `mediainfo` text field to the
			// server response.  This custom entry renders it in the dialog.
			commandsOptions: {
				info: {
					custom: {
						// MediaInfo row in the Info dialog.
						// The elFinder info dialog builds from cached file data and
						// never triggers a cmd:info server request on its own.
						// We make an explicit AJAX call here so the PHP plugin can
						// run 'mediainfo' and return the result for this file.
						mediainfo: {
							label : 'MediaInfo',
							tpl   : '<div class="elfinder-info-mediainfo"><span class="elfinder-spinner"></span></div>',
							mimes : ['audio', 'video'],
							action: function(file, fm, dialog) {
								var el = dialog.find('.elfinder-info-mediainfo');
								// If already in client cache (e.g. second open), show instantly
								if (file.mediainfo) {
									el.html('<pre>' + fm.escape(file.mediainfo) + '</pre>');
									return;
								}
								// Request from server: PHP plugin adds 'mediainfo' to response
								fm.request({
									data: { cmd: 'info', targets: [file.hash], with_mediainfo: 1 },
									preventDefault: true
								}).done(function(data) {
									var f = data.files && data.files.length ? data.files[0] : null;
									if (f && f.mediainfo) {
										try { fm.cache(data.files); } catch(e) {} // update local cache
										el.html('<pre>' + fm.escape(f.mediainfo) + '</pre>');
									} else {
										el.closest('tr').hide();
									}
								}).fail(function() {
									el.closest('tr').hide();
								});
							}
						}
					}
				}
			},
			// ── Bootup callback ───────────────────────────────────────────
			bootCallback: function(fm, extraObj) {
				fm.bind('error', function(e) {
					var data = (e && e.data) ? e.data : {};
					if (efHandleAuthRuntimeError(data)) {
						if (e && typeof e.preventDefault === 'function') {
							e.preventDefault();
						}
						return false;
					}
					return true;
				});

				// NOTE: bootCallback fires during the elFinder constructor,
				// before any UI widgets (toolbar, etc.) exist.
				// Toolbar manipulation must be deferred to the 'load' event.

				// Update browser tab title to reflect current directory
				var title = document.title;
				fm.bind('open', function() {
					var cwd  = fm.cwd();
					var path = cwd ? (fm.path(cwd.hash) || '') : '';
					document.title = path ? path + ' – ' + title : title;
				}).bind('destroy', function() {
					document.title = title;
				});

				// Inject toolbar extras once toolbar is available, then keep
				// them after any toolbar re-render using a MutationObserver.
				var getToolbar = function() {
					if (!fm || !fm.ui || !fm.ui.toolbar) return null;
					var t = $(fm.ui.toolbar);
					return (t && t.length) ? t : null;
				};

				var syncToolbarModeState = function() {
					var toolbar = getToolbar();
					if (!toolbar || !toolbar.length) return;
					var isMobileNow = window.matchMedia && window.matchMedia('(max-width: 600px)').matches;
					var $toggle = $('#ef-toolbar-toggle');

					if (isMobileNow) {
						var tbVisible = true;
						try {
							var _s = localStorage.getItem('ef_toolbar_visible');
							if (_s === '0') tbVisible = false;
						} catch (e) {}
						$toggle.show();
						if (tbVisible !== toolbar.is(':visible')) {
							toolbar.stop(true, true).trigger('toggle', { duration: 0, handleH: 50 });
						}
						$toggle.html(tbVisible ? '&#9660; Toolbar' : '&#9654; Toolbar');
					} else {
						$toggle.hide();
						if (!toolbar.is(':visible')) {
							toolbar.stop(true, true).trigger('toggle', { duration: 0, handleH: 50 });
						}
					}
				};

				var injectToolbarExtras = function() {
					var toolbar = getToolbar();
					if (!toolbar) return false;

					var syncInjectedToolbarLabels = function() {
						var show = false;
						try {
							show = (fm.storage('toolbarTextLabel') == 1);
						} catch (e) {
							show = false;
						}
						var $labels = toolbar
							.find('#ef-skin-btn .elfinder-button-text, #ef-mediainfo-btn .elfinder-button-text, #ef-movieinfo-btn .elfinder-button-text, #ef-vlc-btn .elfinder-button-text, #ef-videoplayer-btn .elfinder-button-text');
						$labels[show ? 'show' : 'hide']();
					};

					// 1. Inject toolbar buttons only if missing.  Idempotent
					//    insertion avoids mutation loops and UI hangs.
					if (!toolbar.find('#ef-skin-btn').length) {
						var $skinBtnSet = $(
							'<div class="ui-widget-content ui-corner-all elfinder-buttonset">' +
							'<div id="ef-skin-btn" class="ui-state-default elfinder-button"' +
							' title="Change theme / skin">' +
							'<span class="elfinder-button-icon elfinder-button-icon-skin"></span>' +
							'<span class="elfinder-button-text" style="display:none;">Change theme / skin</span>' +
							'</div></div>');
						$skinBtnSet.find('#ef-skin-btn').on('click', function(e) {
							e.stopPropagation();
							efToggleSkinPanel(this);
						});
						toolbar.append($skinBtnSet);
					}

					// 2. Inject 🎴 MediaInfo button.
					if (!toolbar.find('#ef-mediainfo-btn').length) {
						var $miBtnSet = $(
							'<div class="ui-widget-content ui-corner-all elfinder-buttonset">' +
							'<div id="ef-mediainfo-btn" class="ui-state-default elfinder-button"' +
							' title="MediaInfo">' +
							'<span class="elfinder-button-icon elfinder-button-icon-mediainfo"></span>' +
							'<span class="elfinder-button-text" style="display:none;">MediaInfo</span>' +
							'</div></div>');
						$miBtnSet.find('#ef-mediainfo-btn').on('click', function(e) {
							e.stopPropagation();
							efShowMediaInfo(fm);
						});
						toolbar.append($miBtnSet);
					}

					// 3. Inject 🎞️ MovieInfo button (TMDb / OMDb / Wikipedia / IMDb lookup).
					if (!toolbar.find('#ef-movieinfo-btn').length) {
						var $movieBtnSet = $(
							'<div class="ui-widget-content ui-corner-all elfinder-buttonset">' +
							'<div id="ef-movieinfo-btn" class="ui-state-default elfinder-button"' +
							' title="Movie Info (TMDb / OMDb / Wikipedia / IMDb)">' +
							'<span class="elfinder-button-icon elfinder-button-icon-movieinfo"></span>' +
							'<span class="elfinder-button-text" style="display:none;">Movie Info</span>' +
							'</div></div>');
						$movieBtnSet.find('#ef-movieinfo-btn').on('click', function(e) {
							e.stopPropagation();
							efShowMovieInfo(fm);
						});
						toolbar.append($movieBtnSet);
					}

					// 4. Inject 📺 VLC button.
					if (!toolbar.find('#ef-vlc-btn').length) {
						var $vlcBtnSet = $(
							'<div class="ui-widget-content ui-corner-all elfinder-buttonset">' +
							'<div id="ef-vlc-btn" class="ui-state-default elfinder-button"' +
							' title="Open in VLC">' +
							'<span class="elfinder-button-icon elfinder-button-icon-vlc"></span>' +
							'<span class="elfinder-button-text" style="display:none;">Open in VLC</span>' +
							'</div></div>');
						$vlcBtnSet.find('#ef-vlc-btn').on('click', function(e) {
							e.stopPropagation();
							efOpenInVlc(fm);
						});
						toolbar.append($vlcBtnSet);
					}

					// 5. Mobile top drawer toggle. Place it before the toolbar so it
					if (!toolbar.find('#ef-videoplayer-btn').length) {
						var $videoBtnSet = $(
							'<div class="ui-widget-content ui-corner-all elfinder-buttonset">' +
							'<div id="ef-videoplayer-btn" class="ui-state-default elfinder-button"' +
							' title="Open video player">' +
							'<span class="elfinder-button-icon elfinder-button-icon-videoplayer"></span>' +
							'<span class="elfinder-button-text" style="display:none;">Player</span>' +
							'</div></div>');
						$videoBtnSet.find('#ef-videoplayer-btn').on('click', function(e) {
							e.stopPropagation();
							efOpenInVideoPlayer(fm);
						});
						toolbar.append($videoBtnSet);
					}

					// 6. Mobile top drawer toggle. Place it before the toolbar so it
					// remains visible even when the toolbar itself is hidden.
					if (!$('#ef-toolbar-toggle').length) {
						var tbVisible = true;
						try {
							var _s = localStorage.getItem('ef_toolbar_visible');
							if (_s === '0') tbVisible = false;
						} catch (e) {}
						var $toggle = $('<div id="ef-toolbar-toggle" title="Show / hide toolbar">' +
							(tbVisible ? '&#9660; Toolbar' : '&#9654; Toolbar') + '</div>');
						$toggle.on('click', function() {
							tbVisible = toolbar.is(':hidden');
							toolbar.stop(true, true).trigger('toggle', { duration: 120, handleH: 50 });
							$(this).html(tbVisible ? '&#9660; Toolbar' : '&#9654; Toolbar');
							try { localStorage.setItem('ef_toolbar_visible', tbVisible ? '1' : '0'); } catch (e) {}
						});
						toolbar.before($toggle);
					}

					// On mobile, first run defaults to visible labels using native
					// elFinder toolbar preference storage and keeps context-menu toggle working.
					if (isMobile) {
						try {
							if (fm.storage('toolbarTextLabel') === null) {
								fm.storage('toolbarTextLabel', '1');
								toolbar.find('.elfinder-button-text').show();
								fm.trigger('uiresize');
							}
						} catch (e) {}
					}

					syncInjectedToolbarLabels();
					syncToolbarModeState();
					return true;
				};

				var observeToolbar = function() {
					var toolbar = getToolbar();
					if (!toolbar || toolbar.data('efObserverAttached')) return;
					if (typeof MutationObserver !== 'function') return;
					toolbar.data('efObserverAttached', '1');
					var observer = new MutationObserver(function() {
						injectToolbarExtras();
					});
					observer.observe(toolbar.get(0), { childList: true });
				};

				var retries = 0;
				var toolbarTimer = setInterval(function() {
					retries++;
					if (injectToolbarExtras()) {
						observeToolbar();
						clearInterval(toolbarTimer);
					} else if (retries > 40) {
						clearInterval(toolbarTimer);
					}
				}, 100);
				injectToolbarExtras();

				var onViewportResize = function() {
					try {
						efApplyViewportContainerSize();
						syncToolbarModeState();
						if (fm && typeof fm.resize === 'function') {
							fm.resize();
						} else if (fm) {
							fm.trigger('uiresize');
						}
						setTimeout(function() {
							efApplyViewportContainerSize();
							syncToolbarModeState();
						}, 80);
					} catch (e) {}
				};
				$(window).off('resize.efViewport orientationchange.efViewport').on('resize.efViewport orientationchange.efViewport', function() {
					setTimeout(onViewportResize, 30);
				});
				if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
					window.visualViewport.addEventListener('resize', onViewportResize);
					window.visualViewport.addEventListener('scroll', onViewportResize);
				}
				setTimeout(onViewportResize, 60);
			}
		});
	}

	// ── Apply theme and boot ──────────────────────────────────────────────────
	function bootWithI18n() {
		if (i18nFile) {
			var script = document.createElement('script');
			script.src = 'js/i18n/' + i18nFile + '.js';
			script.onload  = initElFinder;
			script.onerror = initElFinder;
			document.head.appendChild(script);
		} else {
			initElFinder();
		}
	}

	function efRememberHashForLogin() {
		try {
			if (window.location.hash) {
				localStorage.setItem('ef_after_login_hash', window.location.hash);
			}
		} catch (e) {}
	}

	function efEnsureAuthOrRedirect() {
		var url = 'php/connector.php?cmd=auth_ping&_=' + Date.now();
		return fetch(url, {
			method: 'GET',
			credentials: 'same-origin',
			cache: 'no-store'
		}).then(function(resp) {
			return resp.text().then(function(text) {
				var payload = {};
				try { payload = JSON.parse(text || '{}'); } catch (e) {}
				if (resp.ok && payload && payload.success === true) {
					return true;
				}
				efRememberHashForLogin();
				window.location.href = (payload && payload.login_url) ? payload.login_url : '/cgi-bin/conf/elfinder?subpage=elfinder/';
				return false;
			});
		}).catch(function() {
			efRememberHashForLogin();
			window.location.href = '/cgi-bin/conf/elfinder?subpage=elfinder/';
			return false;
		});
	}

	function efHandleAuthRuntimeError(payload) {
		var text = '';
		if (typeof payload === 'string') {
			text = payload;
		} else if (payload && typeof payload.error === 'string') {
			text = payload.error;
		} else if (payload && payload.error && payload.error.length) {
			text = String(payload.error[0]);
		}
		if (!/Authentication required/i.test(text)) {
			return false;
		}
		efRememberHashForLogin();
		window.location.href = '/cgi-bin/conf/elfinder?subpage=elfinder/';
		return true;
	}

	function efRestoreHashAfterLogin() {
		if (window.location.hash) {
			return false;
		}
		var savedHash = '';
		try {
			savedHash = localStorage.getItem('ef_after_login_hash') || '';
			if (savedHash) {
				localStorage.removeItem('ef_after_login_hash');
			}
		} catch (e) {}
		if (!savedHash) {
			return false;
		}
		if (savedHash.charAt(0) !== '#') {
			savedHash = '#' + savedHash;
		}
		// Update hash in-place and continue boot to avoid blank-page timing issues
		// observed on some browsers when using full location.replace() here.
		window.location.hash = savedHash;
		return false;
	}

	$(document).ready(function() {
		if (efRestoreHashAfterLogin()) {
			return;
		}

		efEnsureAuthOrRedirect().then(function(canContinue) {
			if (!canContinue) {
				return;
			}

			// 1. Restore theme from localStorage (instant, no flicker)
			var savedTheme = '';
			try { savedTheme = localStorage.getItem('elfinder_theme') || ''; } catch(e) {}

			// Pre-select skin dropdown
			var sel = document.getElementById('ef-skin-select');
			if (sel && savedTheme) {
				for (var i = 0; i < sel.options.length; i++) {
					if (sel.options[i].value === savedTheme) { sel.selectedIndex = i; break; }
				}
			}

			// 2. Skip optional get_status CGI call to avoid auth HTML responses
			// interfering with session cookies in some browsers.
			efApplyTheme(savedTheme);
			bootWithI18n();
		});
	});
