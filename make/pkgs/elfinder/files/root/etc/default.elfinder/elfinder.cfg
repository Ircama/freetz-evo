# ============================================================================
# elFinder Default Configuration
# ============================================================================
# All variables MUST be exported so modconf can discover and save them.

# ============================================================================
# System Configuration (used by init scripts and the CGI configuration page)
# ============================================================================

# Base directory exposed to elFinder as the root volume.
# Defaults to the first USB-storage mount point when left empty.
export ELFINDER_BASEDIR='/var/media/ftp'

# HTTP URL path under which ELFINDER_BASEDIR is directly served by lighttpd (port 81).
# Example: if /var/media/ftp is served at http://fritz.box:81/files/ then set '/files/'.
# Leave EMPTY if the basedir is NOT served via lighttpd (which is the common case).
# With an empty URL elFinder routes all file access through the PHP connector instead
# of direct HTTP links.  Do NOT set this to '/MediaServer/' – that is AVM's UPnP
# media server on a different port and will cause 404 errors for previews.
export ELFINDER_URL=''

# ============================================================================
# Upload Settings
# ============================================================================

# Maximum size for a single uploaded file.
# Must be a PHP size string (e.g. 32M, 64M, 128M, 1G).
export ELFINDER_MAX_UPLOAD_SIZE='64M'

# Comma-separated list of MIME types allowed for upload.
# Set to 'all' to allow every MIME type (requires Build-time option ALLOW_ALL_UPLOADS).
# Default: allow common media and text types suitable for home-NAS use.
export ELFINDER_UPLOAD_ALLOW='image/,audio/,video/,text/plain,application/pdf,application/zip,application/x-gzip,application/x-bzip2,application/x-7z-compressed,application/x-rar-compressed,application/octet-stream'

# ============================================================================
# Authentication
# ============================================================================

# Enable simple password protection for elFinder.
# 'yes'  → elFinder integration into the existing httpd-webcfg auth.
# 'no'   → no additional auth layer (relies on httpd-webcfg global auth).
export ELFINDER_AUTH_ENABLED='yes'

# ============================================================================
# Thumbnail generation
# ============================================================================

# Directory used to cache thumbnails.  Must be writable by the web server.
# An empty value uses the default: ELFINDER_BASEDIR/.tmb/
export ELFINDER_THUMBPATH=''

# ============================================================================
# Archive support
# ============================================================================

# Path to unrar binary (leave empty for auto-detect).
export ELFINDER_UNRAR_PATH=''

# Path to 7za binary (leave empty for auto-detect).
export ELFINDER_7Z_PATH=''

# Path to convert (ImageMagick) binary (leave empty for auto-detect).
export ELFINDER_CONVERT_PATH=''

# ============================================================================
# MediaInfo integration
# ============================================================================

# Path to mediainfo binary (leave empty for auto-detect from $PATH).
export ELFINDER_MEDIAINFO_PATH=''

# ============================================================================
# Visual Theme
# ============================================================================

# Active UI theme name.  Must match a subdirectory under css/themes/ that
# contains css/theme.css.  Leave empty to use the built-in elfinder theme.
# Available after build (if enabled): moono, windows-10, material, bootstrap
export ELFINDER_THEME=''
