# freetz-proxy.cfg — service list for the Freetz HTTPS gateway
#
# Format:  name=port[:path[:direct]]
#
#   name   - service identifier, used in proxy URL: ?service=name
#   port   - upstream TCP port on 127.0.0.1
#   path   - default upstream path (default: /)
#   direct - literal word "direct": index page shows a plain HTTP link
#            instead of routing the request through the HTTPS proxy
#
# With "direct": suitable for apps that require WebSocket or heavy
#   JavaScript loaded from the same origin (e.g. ruTorrent, ttyd).
#   The index page shows:  http://fritz.box:port/path
#
# Without "direct": the page is served via the HTTPS gateway —
#   suitable as a PWA-installable page (e.g. Freetz admin UI).
#
# The "freetz" entry is auto-added from MOD_HTTPD_PORT in mod.cfg
# when absent from this file; explicit entry here overrides that.

# Freetz admin UI — proxied over HTTPS (PWA-compatible)
freetz=81

# rtorrent configuration CGI — proxied over HTTPS
rtorrent=81:/cgi-bin/conf/rtorrent

# rtorrent config HTML editor — direct HTTP (ACE editor, complex JS)
rtorrent_cfg=81:/rtorrent/rtorrent_config_editor.html:direct

# ruTorrent config HTML editor — direct HTTP (ACE editor, complex JS)
rutorrent_cfg=81:/rtorrent/rutorrent_config_editor.html:direct

# ruTorrent web UI — direct HTTP link (WebSocket, heavy JS)
rutorrent=81:/rutorrent/:direct

# ttyd terminal — direct HTTP link (WebSocket required)
ttyd=7681::direct
