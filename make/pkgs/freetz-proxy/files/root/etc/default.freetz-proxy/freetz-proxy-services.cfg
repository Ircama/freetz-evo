# freetz-proxy.cfg — service list for the Freetz HTTPS gateway
#
# Format:  name=port[:path[:direct]]
#
#   name   - service identifier, used in proxy URL: ?service=name
#   port   - upstream TCP port on 127.0.0.1
#   path   - default upstream path (default: /)
#   direct - literal word "direct": index page shows a plain HTTP link
#            instead of routing the request through the HTTPS proxy
#
# With "direct": suitable for apps that require WebSocket or heavy
#   JavaScript loaded from the same origin (e.g. ruTorrent, ttyd).
#   The index page shows:  http://fritz.box:port/path
#
# Without "direct": the page is served via the HTTPS gateway —
#   suitable as a PWA-installable page (e.g. Freetz admin UI).
#
# The "freetz" entry is auto-added from MOD_HTTPD_PORT in mod.cfg
# when absent from this file; explicit entry here overrides that.
#
# ── Security directives (@key=yes|no) ─────────────────────────────────
#
# @block_internet=yes    Block all proxy access when SERVER_NAME ends
#                        with .myfritz.net (internet / MyFritz access).
#                        Returns HTTP 403.  Default: no.
#
# @no_internet_cookie=yes  Strip Max-Age and Expires from Set-Cookie
#                        response headers when accessed from the internet
#                        (.myfritz.net).  Cookies become session-only and
#                        are deleted when the browser closes.  Default: yes.
#
# @no_cookie=yes         Strip Max-Age and Expires from ALL Set-Cookie
#                        response headers regardless of origin.  Default: no.
#
# @internet_domains=...  Comma-separated list of hostname substrings that
#                        indicate the request is coming from the internet.
#                        Default: .myfritz.net
#                        Example: @internet_domains=.myfritz.net,.dyndns.org
#
# @disabled=yes          Disable the proxy entirely.  Every request returns
#                        a simple HTML notice page.  Default: no.
#
@disabled=no
@block_internet=no
@no_internet_cookie=yes
@no_cookie=no
@internet_domains=.myfritz.net
@trace_file=

# ── Services ───────────────────────────────────────────────────────────
#
# Use port 0 to automatically use the Freetz HTTP port (MOD_HTTPD_PORT
# from mod.cfg, default 81).  The "freetz" service is added automatically
# when not listed here — explicit entry overrides the auto-detected port.
#

# rtorrent configuration CGI — proxied over HTTPS
rtorrent=0:/cgi-bin/conf/rtorrent

# rtorrent config HTML editor — direct HTTP (ACE editor, complex JS)
rtorrent_cfg=0:/rtorrent/rtorrent_config_editor.html:direct

# ruTorrent config HTML editor — direct HTTP (ACE editor, complex JS)
rutorrent_cfg=0:/rtorrent/rutorrent_config_editor.html:direct

# ruTorrent web UI — direct HTTP link (WebSocket, heavy JS)
rutorrent=0:/rutorrent/:direct

# ttyd terminal — direct HTTP link (WebSocket required)
ttyd=7681::direct
