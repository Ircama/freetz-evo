# homeassistant - Home Assistant setup helper and autorun - default settings.
#
# Every variable must be exported, otherwise the web interface shows no field
# for it and the value is never saved. Values changed by the user are stored in
# /mod/etc/conf/homeassistant.cfg and override the defaults below.
#
# Home Assistant itself is installed on demand by /usr/bin/ha-setup: Freetz only
# ships the helper, the init script and this configuration.

# Start Home Assistant at boot (yes/no). Keep it off until ha-setup finished.
export HOMEASSISTANT_ENABLED='no'

# Base directory of the installation; it must live on persistent external
# storage (USB stick or NAS). The installer creates these subdirectories:
#   <basedir>/python   Python packages and the "hass" launcher
#   <basedir>/config   configuration.yaml, database, logs
#   <basedir>/pip      pip bootstrap
export HOMEASSISTANT_BASEDIR='/var/media/ftp/homeassistant'

# Override the Python prefix (default: <basedir>/python)
export HOMEASSISTANT_PYTHON_PREFIX=''

# Override the configuration directory (default: <basedir>/config)
export HOMEASSISTANT_CONFIG=''

# Port shown in the starter configuration.yaml and reported by the init script.
# Home Assistant reads the effective value from configuration.yaml (http:).
export HOMEASSISTANT_HTTP_PORT='8123'

# Package version installed by "ha-setup --install" (empty = latest release)
export HOMEASSISTANT_VERSION=''

# Alternative PyPI index, useful on networks that need a mirror (empty = pypi.org)
export HOMEASSISTANT_PIP_INDEX_URL=''

# Write the log to <config>/home-assistant.log instead of the console (yes/no)
export HOMEASSISTANT_LOG_TO_FILE='yes'

# Nice level of the Python process
export HOMEASSISTANT_NICE='5'

# Seconds to wait for the storage holding the installation at boot.
# 0 = assume it is already available (internal storage, testing)
export HOMEASSISTANT_CONFIG_WAIT='120'

# Verbose logging (sets PYTHONVERBOSE=1, very noisy)
export HOMEASSISTANT_VERBOSE='no'

# Additional command line arguments for "hass"
export HOMEASSISTANT_EXTRA_ARGS=''
