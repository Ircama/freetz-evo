# Matter controller for Freetz-EVO — matter-bridge milestone 2
#
# Second binary of the `matter-bridge` package: a native, in-box Matter
# *controller* built on rs-matter's controller-side primitives.
#
# The revisions/features here mirror `make/pkgs/freetz-matter` (same
# rs-matter pin, same feature set), because both binaries link the same
# rs-matter.

[package]
name = "matter-bridge-ctl"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "matter-bridge-ctl"
path = "src/main.rs"

[[bin]]
name = "matter-bridge"
path = "src/server.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
static_cell = "2"
async-io = "2"
futures-lite = "2"
heapless = "0.9"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
async-channel = "2"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }

rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "7d5684f495fe5bca03d993647543508ab7587f10", features = [
    "async-io",
    "groups",
    "persistent-subscriptions",
    "max-groups-per-fabric-12",
    "max-group-keys-per-fabric-3",
    "max-group-endpoints-per-fabric-3",
    "max-sessions-32",
] }
socket2 = "0.6"
libc = "0.2"

# Same build profile as the freetz-matter package: uClibc/MIPS toolchains
# cannot afford fat LTO or a single codegen unit of a crate this size.
[profile.release]
opt-level = 1
lto = false
codegen-units = 256
debug = false
overflow-checks = false
