# matter-bridge - native Matter WebSocket server for Domoticz - default setup.
#
# Every variable must be exported, otherwise the web interface shows no field
# for it and the value is never saved. Values changed by the user are stored in
# /mod/etc/conf/matter-bridge.cfg and override the defaults below.

# Start matter-bridge when the box boots (yes/no)
export MATTER_BRIDGE_ENABLED='no'

# TCP port of the WebSocket server. Domoticz expects 5580 unless its Matter
# hardware entry is configured differently.
export MATTER_BRIDGE_PORT='5580'
export MATTER_BRIDGE_BIND='127.0.0.1'

# Legacy options retained for saved configurations; the native server ignores them.
export MATTER_BRIDGE_STATE='/mod/etc/matter-bridge/nodes.json'

export MATTER_BRIDGE_STORE='/tmp/flash/matter-bridge'
export MATTER_BRIDGE_PEER='[::1]:5540'
export MATTER_BRIDGE_AUTO_LOCAL='yes'

export MATTER_BRIDGE_SEED='/etc/matter-bridge/nodes.json'

# Verbose logging (yes/no). Log goes to /tmp/rc.matter-bridge.log
export MATTER_BRIDGE_VERBOSE='no'

# Additional native controller command line options.
export MATTER_BRIDGE_EXTRA_ARGS=''
