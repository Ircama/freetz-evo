# llama-cpp default configuration
# Loaded by /etc/init.d/rc.llama-cpp and modconf.

# --- System variables (used by the init script) ---

# Start llama-server automatically at boot?
export LLAMA_CPP_ENABLED='no'

# Base directory on external storage.
# WARNING: must be on a writable filesystem (USB, NAS, ext4/ext3 recommended).
# The init script looks for model files (*.gguf) here.
export LLAMA_CPP_BASEDIR='/var/media/ftp/llama-cpp'

# Optional: absolute path to the GGUF model to load at startup.
# If empty, llama-server starts without a model (models can be loaded
# later via the API: POST /v1/models/load).
export LLAMA_CPP_MODEL=''

# --- llama-server runtime settings ---

# Interface to listen on (0.0.0.0 = all interfaces, 127.0.0.1 = localhost only)
export LLAMA_CPP_HOST='0.0.0.0'

# Port for the llama-server REST API
export LLAMA_CPP_PORT='8080'

# Number of CPU threads.  0 = auto-detect (uses all cores).
# On a 4-core FRITZ!Box this defaults to 4.
export LLAMA_CPP_THREADS='4'

# Context size in tokens.  Smaller = less RAM.
# Recommended for 512 MB RAM devices: 512 to 2048.
export LLAMA_CPP_CTX_SIZE='2048'

# GPU layers to offload.  MUST be 0 on CPU-only (no GPU on FRITZ!Box).
export LLAMA_CPP_NGL='0'

# Maximum number of simultaneous client connections
export LLAMA_CPP_PARALLEL='1'

# Extra flags passed verbatim to llama-server (e.g. --no-mmap --verbose-prompt)
export LLAMA_CPP_EXTRA_ARGS=''

# Wait time at boot (seconds) before starting.
# 0 = synchronous boot start (requires BASEDIR available immediately).
# >0 = asynchronous background start (waits for USB/NAS mount).
export LLAMA_CPP_CONFIG_WAIT='120'

# Process nice value (lower = higher priority, -20..19)
export LLAMA_CPP_NICE='5'
