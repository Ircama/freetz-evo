# ============================================================================
# rtorrent/rutorrent Default Configuration
# ============================================================================
# Only parameters used by the web interface CGI and init scripts
# Other rtorrent settings are configured directly in .rtorrent.rc

# ============================================================================
# System Configuration (used by init scripts and framework)
# ============================================================================
export RTORRENT_ENABLED='no'        # Autostart on boot: 'yes' or 'no'
export RTORRENT_BASEDIR=''          # Base directory (auto-detected if empty: /var/media/ftp/${MOD_STOR_PREFIX}01/rtorrent)
export RTORRENT_NICE='5'            # Process priority: -20 (highest) to 19 (lowest)
export RTORRENT_CONFIG_WAIT='120'   # Boot wait time: how long to wait for USB/network at system boot (seconds)
                                     # 0 = immediate synchronous start (for internal storage only)
                                     # >0 = background async start with wait (for USB drives/NAS)
export RTORRENT_BOOT_MONITOR='yes'  # Monitor at boot: if 'yes', watch process for a short period and restart if it dies
export RTORRENT_BOOT_MONITOR_INTERVAL='10'   # Monitor interval (seconds)
export RTORRENT_BOOT_MONITOR_DURATION='300'  # Monitor duration (seconds)

# ============================================================================
# Runtime Configuration (passed through to .rtorrent.rc only)
# Note: These are exported so the framework can collect them from POST,
# but they are ONLY written to .rtorrent.rc by rtorrent.save, not used by init scripts
# ============================================================================

# Peer settings
# NOTE: Values optimized for embedded FritzBox devices to prevent resource exhaustion
export RTORRENT_UPLOADRATE='50'        # Upload rate limit in KB/s
export RTORRENT_DOWNLOADRATE='300'     # Download rate limit in KB/s
export RTORRENT_MAX_PEERS='40'         # Max peers per torrent (normal) - reduced from 60
export RTORRENT_MAX_PEERS_SEED='50'    # Max peers per torrent (seeding) - reduced from 80
export RTORRENT_MIN_PEERS='20'         # Min peers per torrent (normal)
export RTORRENT_MIN_PEERS_SEED='30'    # Min peers per torrent (seeding)
export RTORRENT_PEERLIMIT='30'         # Global max simultaneous uploads - CRITICAL: reduced from 250 to prevent socket exhaustion
export RTORRENT_UPLOADSLOTS='30'       # Upload slots per torrent - reduced from 100

# DHT settings
export RTORRENT_DHT='auto'             # DHT mode: 'auto', 'on', 'off'
export RTORRENT_DHTPORT='6881'         # DHT port

# Other settings
export RTORRENT_SCGI_PORT='16891'      # SCGI port for ruTorrent/XMLRPC (default: 16891)
                                       # Traditional ports: 5000 or 5555, but 16891 avoids conflicts with Flask, Docker, UPnP
export RTORRENT_PIECES_MEMORY_MAX='64M' # RAM for buffering torrent pieces (32M/64M/128M)
                                       # Critical on low-RAM devices: too high = OOM, too low = slow
export RTORRENT_CHECKHASH='yes'        # Check hash on completion: 'yes' or 'no'

# ============================================================================
# ruTorrent Configuration
# ============================================================================
export RUTORRENT_USES_HOME='yes'       # Use $HOME for temp files: 'yes' or 'no'


