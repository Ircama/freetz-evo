# Pi-hole package defaults for freetz-ng (CGI package)
# Exported variables are required so modconf can persist form values.
#
# System variables (used by init script)
export PIHOLE_ENABLED='no'
export PIHOLE_CONFIG_WAIT='30'

# Base directory for blocklists and runtime data
export PIHOLE_BASEDIR='/tmp/flash/pi-hole'

# Upstream DNS servers (space-separated)
export PIHOLE_DNS_UPSTREAM='8.8.8.8 8.8.4.4'

# Blocklist URLs (space-separated)
export PIHOLE_BLOCKLIST_URLS='https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts'

# Web interface password (empty = no authentication)
export PIHOLE_WEB_PASSWORD=''

# Rate limiting
export PIHOLE_RATE_LIMIT='1000'

# Logging (0=off, 1=queries, 2=everything)
export PIHOLE_LOG_LEVEL='0'

# Runtime pass-through (exported only to allow POST capture)
# These are written to dnsmasq config by save hook, not used by init script
export PIHOLE_DNS_PORT='53'
export PIHOLE_DHCP_ACTIVE='no'
export PIHOLE_DHCP_START=''
export PIHOLE_DHCP_END=''
export PIHOLE_DHCP_LEASETIME='12h'
export PIHOLE_BLOCKING_MODE='NULL'  # NULL=0.0.0.0, NXDOMAIN=refused
