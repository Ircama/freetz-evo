# ble2uart_gateway -- BLE advertisement gateway (ESP32 ADV_BLE2UART) -- default setup.
#
# Every variable must be exported, otherwise the web interface shows no field
# for it and the value is never saved. Values changed by the user are stored in
# /mod/etc/conf/ble2uart_gateway.cfg and override the defaults below.

# Start ble2uart_gateway when the box boots (yes/no)
export BLE2UART_GATEWAY_ENABLED='no'

# Serial link to the ESP32 module. The firmware uses the ESP32-C3 native
# USB Serial/JTAG, so the host baudrate is ignored; the value is kept because
# some serial stacks need one to open the device. Use an empty value to let the
# daemon pick the first /dev/ttyACM* it finds.
export BLE2UART_GATEWAY_SERIAL='/dev/ttyACM0'
export BLE2UART_GATEWAY_BAUDRATE='115200'

# Directory of the structured configuration (ble2uart_gateway.yaml with the devices
# and their bind keys, the filters, the rules and the front-end settings) and of
# the state file with the exposed device ids. Use the storage list in the web
# interface: /tmp/flash is a ramdisk that is only archived to the box flash by
# modsave, so a power cut loses it. The bind keys are secrets: the directory is
# kept at mode 0700 and the configuration file at 0600.
export BLE2UART_GATEWAY_STORE='/tmp/flash/ble2uart_gateway'

# Seconds to wait for the daemon binary when it lives on external storage (the
# package can be externalized): the boot sequence waits for it in a background
# subshell and is never blocked. 0 disables the wait.
export BLE2UART_GATEWAY_CONFIG_WAIT='120'

# Debug logging (yes/no). Log goes to /tmp/rc.ble2uart_gateway.log
export BLE2UART_GATEWAY_VERBOSE='no'

# Additional command line options, for example
#   --serial /dev/ttyACM1 --frontend mysensors=off
export BLE2UART_GATEWAY_EXTRA_ARGS=''
