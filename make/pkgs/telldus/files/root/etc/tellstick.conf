# Default configuration of the telldusd daemon, shipped in the image.
#
# The daemon itself reads and writes /mod/etc/conf/tellstick.conf instead (the
# package patches those paths into the sources), and the init script copies
# this file there the first time it starts: the image is read only, while
# /mod/etc/conf is the directory the freetz configuration framework saves to
# flash, so learned devices and edits survive a reboot.
#
# Edit the copy in /mod/etc/conf/tellstick.conf from the web interface
# (http://fritz.box:81/cgi-bin/conf/telldus) or with tdtool, which also learns
# new devices.
#
# The user and group lines are mandatory: after starting as root telldusd
# switches to them and exits when they do not exist. The upstream default,
# "plugdev", does not exist on a FRITZ!Box.
#
# Layout (libconfuse syntax): a list of device sections, optionally with
# controller sections. Supported protocols are arctech, everflourish, fineoffset,
# fuhaoo, ikano, komfy, mandolyn, nexus, risingsun, sartano, silvan, waveman and
# x10, the parameters of a device depend on the protocol and model.

user = "root"
group = "root"
ignoreControllerConfirmation = "false"

# Example device (as shipped by upstream in /etc/tellstick.conf):
