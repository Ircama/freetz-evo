# telldusd - Tellstick daemon - default setup.
#
# Every variable must be exported, otherwise the web interface shows no field
# for it and the value is never saved. Values changed by the user are stored in
# /mod/etc/conf/telldus.cfg and override the defaults below.

# Start telldusd when the box boots (yes/no)
export TELLDUS_ENABLED='no'

# Verbose daemon log (yes/no), adds --debug; the log is /tmp/rc.telldus.log
export TELLDUS_DEBUG='no'

# Additional telldusd command line options (telldusd --help)
export TELLDUS_EXTRA_ARGS=''

# Content of the daemon configuration file: the controllers and devices
# telldusd knows about (upstream format of /etc/tellstick.conf). Saving this
# page writes the text to /mod/etc/conf/tellstick.conf, which is also the file
# edited by tdtool when devices are learned.
#
# The user and group lines are mandatory: after starting as root telldusd
# switches to them and gives up when they do not exist. root always exists,
# plugdev (the upstream default) does not.
export TELLDUS_DEVICES='user = "root"
group = "root"
ignoreControllerConfirmation = "false"'
