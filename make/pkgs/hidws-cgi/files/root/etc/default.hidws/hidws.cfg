# System variables (used by rc.hidws)
export HIDWS_ENABLED='no'
export HIDWS_PORT='9001'
export HIDWS_NICE='5'

# SSL/TLS (wss://) support: hidws serves BOTH ws:// and wss:// on the same
# port. A self-signed certificate/key is generated automatically on first
# start if it does not exist yet (paths below).
export HIDWS_SSL='yes'
export HIDWS_CERT='/mod/etc/hidws/server.crt'
export HIDWS_KEY='/mod/etc/hidws/server.key'
# Access control (ALL OPTIONAL, disabled by default): set HIDWS_TOKEN, or
# HIDWS_USER + HIDWS_PASSWORD, to require authentication; set HIDWS_ALLOW to a
# comma-separated IPv4 addresses / CIDR prefixes allowlist. Passed to hidws as
# --token / --user / --password / --allow (hidws >= 1.3.0).
export HIDWS_TOKEN=''
export HIDWS_USER=''
export HIDWS_PASSWORD=''
export HIDWS_ALLOW=''
