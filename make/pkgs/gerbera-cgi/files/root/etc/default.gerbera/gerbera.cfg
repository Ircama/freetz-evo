# Gerbera default config for freetz-ng (CGI package)
# Exported variables are required so modconf can persist form values.

export GERBERA_ENABLED='no'
export GERBERA_BASEDIR='/tmp/flash/gerbera'
export GERBERA_PORT='49152'
export GERBERA_FRIENDLY_NAME='Gerbera (Freetz)'
export GERBERA_WEBROOT='/usr/share/gerbera/web'
export GERBERA_HOME=/etc/default.gerbera

# Runtime config template is deployed to GERBERA_BASEDIR/config.xml
# Template: /mod/etc/default.gerbera/config.xml.template

# NOTE: magic.mgc database requires FREETZ_PACKAGE_FILE to be selected.
# NOTE: Web UI files require ~3.9MB and are removed by default unless
#       FREETZ_PACKAGE_GERBERA_WITH_WEBUI is enabled.
